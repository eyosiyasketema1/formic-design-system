version: 2

# package.json declares peer dependencies plus three pinned build tools for
# the landing page (esbuild, tailwindcss, @tailwindcss/cli). A bump to any of
# those changes the bytes of landing.js / landing.css, so it is never merged
# on its own: bump the pin, run python3 scripts/build_landing.py, commit the
# rebuilt files together (the gate fails otherwise, which is the point).
# Security bumps still arrive; handle them the same way.
# The actions pinned in the QA workflow are watched monthly, because a design
# system does not need weekly churn.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "staging"
    commit-message:
      prefix: "CI"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
