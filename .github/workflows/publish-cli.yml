name: Publish CLI

# Publishes cli/ (the `formicai` package) to npm when a GitHub Release is
# published. A release is a tag on main (CLAUDE.md → Releases); the tag's
# version must equal cli/package.json's version, otherwise this fails
# rather than publishing a number nobody bumped. Needs the NPM_TOKEN
# secret (an npm automation token) set once by the maintainer.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance: signs the package with this run's OIDC identity

concurrency:
  group: publish-cli-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish formicai to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check the release tag matches cli/package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          WANT="${TAG#v}"
          if [ "$WANT" != "$PKG" ]; then
            echo "::error::Release tag '$TAG' is version '$WANT' but cli/package.json is '$PKG'. Bump cli/package.json (or retag) and re-publish the release."
            exit 1
          fi
          echo "tag $TAG matches cli/package.json $PKG"

      - name: Check the package assembles
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
