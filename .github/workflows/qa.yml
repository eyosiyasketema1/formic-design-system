name: QA

# The design rules in CLAUDE.md are only real if something enforces them on
# work that did not come from a maintainer. This runs the same gate a
# contributor is asked to run locally, on every PR including forks.
on:
  pull_request:
  push:
    branches: [main]

# Read-only token. Fork PRs get no secrets and cannot write to the repo.
permissions:
  contents: read

# A new push supersedes the run still going for the same branch.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main is production and only ever receives what staging already runs:
  # a PR into main must come from the staging branch. Feature work goes
  # feature → staging (verified on the staging URL) → main.
  promotion:
    name: Only staging reaches main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "staging" ]; then
            echo "::error::PRs into main must come from 'staging' (this one is from '$HEAD'). Open it against staging instead."
            exit 1
          fi
          echo "staging → main: ok"

  qa:
    name: Design system gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # qa_check.py shells out to esbuild to prove every component compiles,
      # and to scripts/build_landing.py to prove the landing page's compiled
      # CSS and JS are current. Without Node both degrade to a note.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run the QA gate
        run: python3 scripts/qa_check.py

      # Cheap belt-and-braces: a wrong or stale SRI hash blocks the script
      # outright and white-screens the live site, and it fails silently in
      # review because the HTML still looks correct.
      - name: Verify Subresource Integrity hashes
        run: python3 scripts/check_sri.py

  # Phase 0 of PLAN-adoption.md: the installer is only proven by installing.
  # scripts/test_install.sh puts this checkout into each fixture under
  # fixtures/ (via FORMIC_REPO) and reports PASS/FAIL per step. Runs on both
  # runner families because the installer is a bash script that shells out
  # to sed, mktemp and friends, and BSD and GNU disagree.
  #
  # Phase 2: every fixture is installed twice, once by install.sh (`installer`)
  # and once by `npx formicai init` against a registry built from this
  # checkout (`cli`, the script's --cli flag). 3 fixtures × 2 OSes × 2 modes.
  #
  # Phase 3: the cli mode is strict on all three fixtures, including the
  # `legacy`, `migrate` and `visual` steps the script runs on an existing
  # project. The (old-app, cli) cell installs Playwright's browser first so
  # `visual` really screenshots and compares instead of passing as skipped.
  install-matrix:
    name: Install ${{ matrix.fixture }} on ${{ matrix.os }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        fixture: [vite-fresh, next-app, old-app]
        mode: [installer, cli]
        # Installer baseline: install.sh is the legacy path kept for the old
        # link. It has no scope / legacy marking, so on an existing project
        # (next-app, old-app) its gates / eslint steps fail by design. Those
        # two cells run, their failures are recorded in the step summary, and
        # they do not fail the workflow. Every cli cell and vite-fresh in both
        # modes are strict. An include naming `fixture` AND `mode` applies to
        # both OSes of that one cell and nothing else. Remove these two
        # entries when install.sh becomes a wrapper for `formicai init`.
        include:
          - fixture: next-app
            mode: installer
            baseline: true
          - fixture: old-app
            mode: installer
            baseline: true
          # The script's flag for the mode: '' for the installer, --cli for
          # the CLI. Set per mode here so the run step needs no branching.
          - mode: installer
            flag: ""
          - mode: cli
            flag: "--cli"
    # (continue-on-error sits on the install step, not the job: at job level
    # GitHub keeps the workflow green but still paints the check red, which
    # reads as a failure on every PR for months. An unset `baseline`
    # (vite-fresh) reads as '' there, which is not 'true'.)

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # test_install.sh derives FORMIC_BRANCH from `git branch --show-current`
      # and exits 2 on a detached HEAD, and install.sh then clones that branch
      # from the local checkout (`git clone --branch "$FORMIC_BRANCH" "$FORMIC_REPO"`).
      # A pull_request checkout IS a detached HEAD (the merge commit), so put
      # the tested commit on a local branch first. The script exports
      # FORMIC_BRANCH itself from this name; it needs no other input.
      - name: Put HEAD on a local branch for the installer to clone
        run: |
          git checkout -B ci-install
          echo "FORMIC_BRANCH=ci-install ($(git rev-parse --short HEAD))"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Both runner images ship python3; the installer and the gates need
      # nothing beyond the standard library.
      - name: Check Python
        run: python3 --version

      # The `visual` step (scripts/visual_check.sh) screenshots old-app's
      # routes before and after `formicai migrate` and compares them. It
      # needs Playwright's chromium-headless-shell; without one it passes as
      # "skipped: no browser", which proves nothing. Only the (old-app, cli)
      # cell runs it, so only that cell pays for the browser. The npm install
      # of playwright lives in FORMIC_VISUAL_HOME (the script's default) and
      # the browser in PLAYWRIGHT_BROWSERS_PATH, pinned under ~/.cache on both
      # OSes so one cache entry per OS × Playwright version covers both.
      # `--with-deps` (the system libraries) is Linux only.
      - name: Cache the browser for the visual check
        if: matrix.fixture == 'old-app' && matrix.mode == 'cli'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/formic-visual
          key: formic-visual-${{ runner.os }}-playwright-1.63.0

      - name: Install the browser for the visual check
        if: matrix.fixture == 'old-app' && matrix.mode == 'cli'
        shell: bash
        run: |
          echo "FORMIC_VISUAL_HOME=$HOME/.cache/formic-visual" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx --yes playwright@1.63.0 install --with-deps chromium-headless-shell
          else
            npx --yes playwright@1.63.0 install chromium-headless-shell
          fi

      # The script prints PASS/FAIL per step and a per-fixture summary. Tee it
      # to a file so the summary step below can publish it even when the
      # script exits 1, and preserve that exit status through the pipe.
      - name: Run the install test
        id: install
        shell: bash
        continue-on-error: ${{ matrix.baseline == true }}
        env:
          FLAG: ${{ matrix.flag }}
        run: |
          set -o pipefail
          # $FLAG unquoted on purpose: '' must vanish, not become an empty argument.
          bash scripts/test_install.sh "${{ matrix.fixture }}" $FLAG 2>&1 | tee install-test.log
          # the browser was installed for this cell, so a skipped visual step is a broken runner, not a pass
          if [ "${{ matrix.fixture }}" = old-app ] && [ "${{ matrix.mode }}" = cli ] && grep -q "visual (skipped" install-test.log; then
            echo "::error::the visual step was skipped: the browser did not launch on this runner"; exit 1
          fi

      - name: Publish the PASS/FAIL lines to the step summary
        if: always()
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
          OS: ${{ matrix.os }}
          MODE: ${{ matrix.mode }}
          BASELINE: ${{ matrix.baseline == true }}
          OUTCOME: ${{ steps.install.outcome }}
        run: |
          {
            echo "## Install test: $FIXTURE on $OS ($MODE)"
            echo
            if [ "$MODE" = "cli" ]; then
              echo "_Installed with \`formicai init\` from a registry built out of this checkout (\`test_install.sh --cli\`)._"
            else
              echo "_Installed with \`install.sh\` cloning this checkout._"
            fi
            echo
            if [ "$BASELINE" = "true" ]; then
              echo "_Installer baseline: install.sh is the legacy path with no scope/legacy marking, so its gates/eslint failures on an existing project are recorded, not blocking (goes away when install.sh wraps \`formicai init\`)._"
              echo
            fi
            echo "Result: **$OUTCOME**"
            echo
            echo '```'
            # PASS/FAIL per step, plus the visual table (header ending in
            # diff%, rows starting with the route, indented two spaces by
            # the script) and the migrate / visual timing lines.
            grep -E '^(PASS|FAIL) |^  (PASS|FAIL|route|/)|diff%|^(migrate|visual): ' install-test.log || echo "(no PASS/FAIL lines: the script did not reach its steps; see the job log)"
            echo '```'
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```'
            cat install-test.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 2 of PLAN-adoption.md: the CLI's own commands (init, add, update,
  # doctor, gates, inventory) against a registry built from this checkout.
  # Strict: a broken command blocks the merge. `npm pack --dry-run` proves
  # the package still assembles (bin, files, engines) so a packaging mistake
  # fails here and not at publish time.
  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check Python
        run: python3 --version

      - name: Run the CLI smoke test
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          bash cli/test/run.sh 2>&1 | tee cli-smoke.log

      - name: Check the package assembles
        working-directory: cli
        run: npm pack --dry-run

      - name: Publish the PASS/FAIL lines to the step summary
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## CLI smoke test (cli/test/run.sh)"
            echo
            echo "Result: **$OUTCOME**"
            echo
            echo '```'
            grep -E '^(PASS|FAIL) ' cli-smoke.log || echo "(no PASS/FAIL lines: the script did not reach its steps; see the job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
