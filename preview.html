    --shadow-overlay: 0 0 0 1px rgba(255,255,255,0.07), 0 4px 16px rgba(0,0,0,0.55), 0 12px 32px rgba(0,0,0,0.45);

:root[data-theme="dark"] {
  --ink: #f0efec; --ink-2: #b0aeaa; --ink-3: #8d8b86;
  --line: #2a2a29; --line-strong: #3f3e3c;
  --hover: #232322; --hover-2: #292928; --inset: #232322;
  --accent: #7c96ff; --orange: #d97706; --green: #22c55e; --red: #f87171;
  --canvas: #131312; --surface: #1c1c1b; --field: #232322;
  --green-tint: #16281c;
  --red-tint: #2e1a19;
  --tooltip-bg: #2c2c2b; --tooltip-muted: #9c9a95;
  --shadow-btn: 0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.07);
  --shadow-card: 0 0 0 1px rgba(255,255,255,0.06), 0 1px 3px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.35);

@theme inline {
  --color-ink: var(--ink);

  --radius-md: var(--radius-md);
  --radius-card: var(--radius-card);
  --shadow-btn: var(--shadow-btn);
  --shadow-card: var(--shadow-card);
  --shadow-overlay: var(--shadow-overlay);
  --text-body: var(--text-body);
  --text-caption: var(--text-caption);
  --text-small: var(--text-small);
  --text-tiny: var(--text-tiny);

@keyframes pixel-on { 0%,100% { opacity:.15 } 40% { opacity:1 } }
@keyframes shimmer-text { 0% { background-position:200% 0 } 100% { background-position:-200% 0 } }

:root[data-palette="sage"][data-theme="dark"] {

:root[data-palette="twilight"][data-theme="dark"] {

:root[data-palette="clay"][data-theme="dark"] {

}
:root[data-palette="ocean"][data-theme="dark"] {

  --canvas:#101516; --surface:#191f21; --field:#1f2628;

}
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }

body { background: var(--canvas); color: var(--ink); font-family: "Questrial", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background-color 250ms ease, color 250ms ease; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useLayoutEffect } = React;

/* ═══════════ Primitives ═══════════ */
const ICON_PATHS = {
  chevron: <path d="M6 9l6 6 6-6" />,
  check: <path d="M20 6L9 17l-5-5" />,
  close: <path d="M18 6L6 18M6 6l12 12" />,
  retry: <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />,
  search: (<><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></>),
};
function Icon({ name, size = 14, strokeWidth = 2.2, className, style }) {
  return (
    <svg aria-hidden width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
      {ICON_PATHS[name]}
    </svg>
  );
}
function Spinner({ size = 12, className = "" }) {
  return (
    <span aria-hidden className={`inline-block shrink-0 rounded-full border-[1.5px] ${className}`}
      style={{ width: size, height: size, animation: "spin 700ms linear infinite",
        borderColor: "color-mix(in srgb, currentColor 30%, transparent)", borderTopColor: "currentColor" }} />
  );
}
function ShimmerLabel({ children, className = "" }) {
  return (
    <span className={`bg-clip-text text-body font-medium text-transparent ${className}`}
      style={{ backgroundImage: "linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%)",
        backgroundSize: "200% 100%", animation: "shimmer-text 1.4s linear infinite" }}>
      {children}
    </span>
  );
}
const CHIP_TONES = {
  field: "bg-field text-ink-2 shadow-hairline",
  surface: "bg-surface text-ink shadow-btn",
  inset: "bg-inset text-ink-2 shadow-hairline",
};
const CHIP_SIZES = {
  xs: "h-4.5 gap-1 rounded-[5px] px-[3px] text-micro",
  sm: "h-5.5 rounded-chip px-1.5 text-tiny",
  md: "h-7 gap-1.5 rounded-chip px-2 text-tiny",
};
function Chip({ as: As = "span", tone = "field", size = "sm", mono = false, className = "", children, ...rest }) {
  return (
    <As className={`inline-flex items-center transition-colors duration-150 ${CHIP_SIZES[size]} ${CHIP_TONES[tone]} ${mono ? "font-mono" : ""} ${className}`} {...rest}>
      {children}
    </As>
  );
}
function DiffStat({ add, del = 0, className = "" }) {
  return (
    <span className={`shrink-0 font-mono text-tiny tabular-nums ${className}`}>
      <span className="text-green">+{add}</span>
      {del > 0 && <span className="text-red"> −{del}</span>}
    </span>
  );
}
function IconButton({ label, onClick, className = "", children, ...rest }) {
  return (
    <button type="button" aria-label={label} onClick={onClick}
      className={`flex size-6 shrink-0 items-center justify-center rounded-sm transition-colors duration-150 ${className}`} {...rest}>
      {children}
    </button>
  );
}
function Disclosure({ open, duration = 300, live = false, className = "", innerClassName = "min-h-0 overflow-hidden", children }) {
  return (
    <div className={`grid transition-[grid-template-rows,opacity] ${className}`}
      style={{ gridTemplateRows: open ? "1fr" : "0fr", opacity: open ? 1 : 0,
        transitionDuration: `${duration}ms`, transitionTimingFunction: "var(--ease-out-quint)" }}>
      <div className={innerClassName} aria-live={live ? "polite" : undefined}>{children}</div>
    </div>
  );
}

/* ═══════════ LoadingState ═══════════ */
const chevron = Array.from({ length: 9 }, (_, i) => {
  const r = Math.floor(i / 3), c = i % 3;
  return (c + Math.abs(r - 1)) * 90;
});
const ORBIT_ORDER = [0, 1, 2, 5, 8, 7, 6, 3];
const orbit = Array.from({ length: 9 }, (_, i) => {
  const k = ORBIT_ORDER.indexOf(i);
  return k === -1 ? null : k * 110;
});
const PATTERNS = {
  Drive: { delays: chevron, dur: 650, round: false },
  Dots: { delays: chevron, dur: 650, round: true },
  Orbit: { delays: orbit, dur: 950, round: false },
};
function LoaderGrid({ delays, dur, round }) {
  return (
    <span aria-hidden className="grid shrink-0 grid-cols-[repeat(3,4px)] gap-[1.5px]">
      {delays.map((delay, index) => (
        <span key={index}
          className={`size-[4px] bg-ink ${round ? "rounded-full" : "rounded-[1px]"}`}
          style={{
            opacity: delay === null ? 0.07 : 0.15,
            animation: delay === null ? "none" : `pixel-on ${dur}ms ease-in-out ${delay}ms infinite`,
          }} />
      ))}
    </span>
  );
}
function useElapsed() {
  const [ds, setDs] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setDs((d) => d + 1), 100);
    return () => clearInterval(t);
  }, []);
  const total = ds / 10;
  if (total < 60) return `${total.toFixed(1)}s`;
  return `${Math.floor(total / 60)}m ${(total % 60).toFixed(1)}s`;
}
function LoadingState({ label, variant = "Drive" }) {
  const elapsed = useElapsed();
  const resolvedLabel = label ?? "Churning";
  const { delays, dur, round } = PATTERNS[variant] ?? PATTERNS.Drive;
  return (
    <div role="status" className="flex w-fit items-center gap-2.5">
      <LoaderGrid delays={delays} dur={dur} round={round} />
      <ShimmerLabel>{resolvedLabel}</ShimmerLabel>
      <span className="font-mono text-small text-ink-3 tabular-nums">{elapsed}</span>
    </div>
  );
}

/* ═══════════ ThinkingState ═══════════ */
const STAGES = [800, 600, 1800, 2600, 1600];
function useSequence(steps) {
  const [stage, setStage] = useState(0);
  useEffect(() => {
    if (stage >= steps.length - 1) return;
    const t = setTimeout(() => setStage((s) => s + 1), steps[stage]);
    return () => clearTimeout(t);
  }, [stage, steps]);
  return stage;
}
const THINK_VARIANTS = {
  Steps: {
    active: "Thinking", done: "Thought for 4 seconds",
    rows: [
      { primary: "Reading flavor briefs" },
      { primary: "Scanning supplier lists" },
      { primary: "Comparing tasting notes", secondary: "6 flavors" },
      { primary: "Writing the scoop report" },
    ],
  },
  Reasoning: {
    active: "Thinking", done: "Thought for 4 seconds",
    rows: [
      { primary: "Summer demand spikes for stone-fruit flavors — peach and apricot lead." },
      { primary: "I should check cone inventory before promoting a waffle-bowl special." },
    ],
  },
  Search: {
    active: "Searching the web", done: "Searched the web",
    query: "best waffle cone supplier",
    rows: [
      { primary: "Joy Cone", secondary: "joycone.com", href: "https://joycone.com/fs_products/waffle-cones/" },
      { primary: "WebstaurantStore", secondary: "webstaurantstore.com", href: "https://www.webstaurantstore.com/ice-cream-shop-supplies.html" },
      { primary: "The Konery", secondary: "thekonery.com", href: "https://www.thekonery.com/" },
    ],
  },
  Coding: {
    active: "Running tools", done: "Ran 3 tools",
    rows: [
      { primary: "Read", secondary: "flavors.ts", mono: true },
      { primary: "Edit", secondary: "ChurnSchedule.tsx", mono: true, add: 74, del: 41 },
      { primary: "Run", secondary: "npm run freeze", mono: true },
    ],
  },
};
function Dot({ tone }) {
  return (
    <span className={`flex size-3.5 shrink-0 items-center justify-center rounded-full text-canvas ${tone}`}>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
        <circle cx="12" cy="12" r="9" />
        <path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
      </svg>
    </span>
  );
}
const TONES = ["bg-accent", "bg-orange", "bg-green"];
function ThinkingState({ variant = "Steps" }) {
  const stage = useSequence(STAGES);
  const [manualExpanded, setManualExpanded] = useState(null);
  const [selectedTool, setSelectedTool] = useState(null);
  const v = THINK_VARIANTS[variant] ?? THINK_VARIANTS.Steps;
  const autoExpanded = stage >= 1 && stage < 4;
  const expanded = manualExpanded ?? autoExpanded;
  const working = stage < 3;
  const visible = stage < 2 ? 0 : stage === 2 ? Math.min(2, v.rows.length) : v.rows.length;
  const traceRef = useRef(null);
  const [lineHeight, setLineHeight] = useState(0);
  useLayoutEffect(() => {
    if (traceRef.current) setLineHeight(traceRef.current.offsetHeight);
  }, [visible, expanded, variant, stage]);
  return (
    <div key={variant} className="flex w-full max-w-95 flex-col"
      style={{ minHeight: working || expanded ? 176 : undefined, transition: "min-height 400ms var(--ease-out-quint)" }}>
      <button type="button" aria-expanded={expanded}
        onClick={() => setManualExpanded((current) => !(current ?? autoExpanded))}
        className="-mx-1.5 flex w-fit items-center gap-2 rounded-control px-1.5 py-1 transition-colors duration-150 hover:bg-hover-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill={working ? "var(--ink-2)" : "var(--ink-3)"}>
          <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z" />
        </svg>
        <span role="status" className="contents">
          {working ? (
            <ShimmerLabel className="whitespace-nowrap">{v.active}</ShimmerLabel>
          ) : (
            <span className="text-body font-medium whitespace-nowrap text-ink-2" style={{ animation: "fade-in 350ms ease-out both" }}>
              {v.done}
            </span>
          )}
        </span>
        <Icon name="chevron" className="text-ink-3 transition-transform duration-300" style={{ transform: expanded ? "rotate(180deg)" : "rotate(0)" }} />
      </button>
      <Disclosure open={expanded} duration={400} innerClassName="overflow-hidden">
          <div className="relative mt-1 ml-[5px] pl-4">
            <span aria-hidden className="absolute left-[3px] w-px bg-line"
              style={{ top: -8, height: lineHeight ? lineHeight - 2 : 0, transition: "height 500ms var(--ease-out-quint)" }} />
            <div ref={traceRef} className="flex flex-col gap-1 py-1">
              {v.query && (
                <div className="flex h-6 items-center gap-2 px-1.5" style={{ animation: expanded ? "fade-up 300ms var(--ease-out-quint) both" : undefined }}>
                  <Icon name="search" strokeWidth={2} className="shrink-0 text-ink-3" />
                  <span className="text-caption text-ink-2">{v.query}</span>
                </div>
              )}
              {v.rows.slice(0, visible).map((row, i) => {
                const content = (
                  <React.Fragment>
                    {variant === "Search" && <Dot tone={TONES[i % 3]} />}
                    {variant === "Steps" && (
                      i < visible - 1 || !working ? (
                        <Icon name="check" strokeWidth={2.5} className="shrink-0 text-ink-3" />
                      ) : (
                        <Spinner className="text-ink-2" />
                      )
                    )}
                    <span className={`min-w-0 truncate text-caption ${variant === "Reasoning" ? "whitespace-normal leading-relaxed text-ink-2" : "font-medium text-ink"} ${variant === "Search" ? "animated-underline" : ""}`}>
                      {row.primary}
                    </span>
                    {row.secondary && (
                      <span className={`shrink-0 text-tiny text-ink-3 ${row.mono ? "font-mono" : ""}`}>{row.secondary}</span>
                    )}
                    {row.add !== undefined && <DiffStat add={row.add} del={row.del} />}
                  </React.Fragment>
                );
                const rowClass = "flex min-h-7 w-full items-center gap-2 rounded-sm px-1.5 py-0.5 text-left";
                const animation = { animation: `fade-up 320ms var(--ease-out-quint) ${i * 120}ms both` };
                if (variant === "Search") {
                  return (
                    <a key={row.primary} href={row.href} target="_blank" rel="noreferrer"

    const onKey = (event) => { if (event.key === "Escape") setPreview(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [preview]);
  useEffect(() => {
    setStep(0); setOpenRows(new Set()); setPreview(null);
  }, [rows]);
  const total = rows.length + 1;
  useEffect(() => {
    if (step >= total) return;
    const t = setTimeout(() => setStep((s) => s + 1), TC_STEP_MS);
    return () => clearTimeout(t);
  }, [step, total]);
  const toggleRow = (index) =>
    setOpenRows((current) => {
      const next = new Set(current);
      if (next.has(index)) next.delete(index); else next.add(index);
      return next;
    });
  return (
    <div className="min-h-[220px] w-full max-w-80 pb-1">
      <button type="button" aria-expanded={open} onClick={() => setOpen((current) => !current)}
        className="-mx-1.5 flex w-fit items-center gap-1.5 rounded-control px-1.5 py-1 text-caption text-ink-2 transition-colors duration-150 hover:bg-hover-2">
        <Icon name="chevron" size={12} className="transition-transform duration-200" style={{ transform: open ? "rotate(0deg)" : "rotate(-90deg)" }} />
        <span className="tabular-nums">{summary}</span>
      </button>
      <Disclosure open={open} live innerClassName="-mx-1 overflow-hidden px-1.5 pb-1">
        <div className="mt-1.5 flex flex-col gap-1">
          {rows.slice(0, step).map((row, rowIndex) => {
            const rowOpen = openRows.has(rowIndex);
            return (
            <div key={rowIndex} style={{ animation: "fade-up 300ms var(--ease-out-quint) both" }}>
              <button type="button" aria-expanded={rowOpen} onClick={() => toggleRow(rowIndex)}
                className="group/row -mx-[3px] flex h-7 w-[calc(100%+6px)] min-w-0 items-center gap-2 rounded-control px-[3px] text-left transition-colors duration-150 hover:bg-hover-2">
                <span className="relative flex size-4 shrink-0 items-center justify-center text-ink-3">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill={row.icon === "think" ? "currentColor" : "none"} stroke="currentColor"
                    className={`transition-opacity duration-150 group-hover/row:opacity-0 ${rowOpen ? "opacity-0" : ""}`}>
                    {TC_ICONS[row.icon]}
                  </svg>
                  <Icon name="chevron" size={12}
                    className={`absolute transition-[opacity,transform] duration-150 group-hover/row:opacity-100 ${rowOpen ? "opacity-100" : "opacity-0"}`}
                    style={{ transform: rowOpen ? "rotate(0deg)" : "rotate(-90deg)" }} />
                </span>
                <span className="shrink-0 text-caption font-medium text-ink">{row.label}</span>
                <Chip mono={row.mono} className="min-w-0 flex-1 cursor-pointer truncate hover:bg-hover-2">
                  {row.chip}
                </Chip>
              </button>
              <Disclosure open={rowOpen}>
                  <div className="mt-0.5 mb-1 ml-2 flex flex-col gap-0.5 border-l border-line py-0.5 pl-3.5">
                    {row.detail.map((line, lineIndex) => (
                      <span key={lineIndex} className={`truncate text-tiny leading-[1.6] ${row.detailMono ? "font-mono" : ""} ${line.tone === "add" ? "text-green" : "text-ink-2"}`}>
                        {line.text}
                      </span>
                    ))}
                  </div>
              </Disclosure>
            </div>
            );
          })}
        </div>
      {step >= total && (
        <div className="mt-2.5 flex max-w-full flex-wrap gap-1.5 border-t border-line pt-2.5">
          {diffs.map((d, i) => (
            <span key={d.file} data-diffchip className="relative" onMouseEnter={openPreview(d.file)} onMouseLeave={closePreview(d.file)}>
              <Chip as="button" type="button" tone="surface" size="md" mono
                aria-expanded={preview?.file === d.file} aria-label={`Show diff for ${d.file}`}
                aria-describedby={preview?.file === d.file ? "ds-diff-preview" : undefined}
                onFocus={openPreview(d.file)} onBlur={closePreview(d.file)}
                className="max-w-full hover:bg-hover"
                style={{ animation: `pop-in 250ms var(--ease-out-quint) ${i * 80}ms both` }}>
                <span className="min-w-0 truncate">{d.file}</span>
                <DiffStat add={d.add} del={d.del} />
              </Chip>
            </span>
          ))}
          {more && (
            <button type="button"
              className="inline-flex h-7 items-center rounded-chip px-1.5 font-mono text-tiny text-ink-3 underline decoration-transparent underline-offset-2 transition-colors duration-150 hover:text-ink-2 hover:decoration-current"
              style={{ animation: `fade-in 300ms ease-out ${diffs.length * 80}ms both` }}>
              {more}
            </button>
          )}
        </div>
      )}
      </Disclosure>
      {preview && ReactDOM.createPortal(
        <div id="ds-diff-preview" role="tooltip" onMouseEnter={cancelClose} onMouseLeave={closePreview(preview.file)}
          className="fixed z-50 w-72 overflow-hidden rounded-md bg-surface shadow-overlay"
          style={{ left: preview.x, top: preview.top, bottom: preview.bottom, animation: "pop-in 160ms var(--ease-out-quint) both", transformOrigin: preview.top === undefined ? "bottom left" : "top left" }}>
          <div className="flex items-center justify-between border-b border-line px-2.5 py-1.5 font-mono text-tiny">
            <span className="min-w-0 truncate text-ink-2">{preview.file}</span>
            <DiffStat add={diffs.find((diff) => diff.file === preview.file)?.add ?? 0} del={diffs.find((diff) => diff.file === preview.file)?.del ?? 0} />
          </div>
          <div className="py-1 font-mono text-tiny leading-[1.8]">
            {(diffLines[preview.file] ?? []).map((line, index) => (
              <div key={index} className={`flex gap-2 px-2.5 whitespace-pre ${line.tone === "add" ? "bg-green-tint text-green" : line.tone === "del" ? "bg-red-tint text-red" : "text-ink-2"}`}>
                <span className="w-3 shrink-0 select-none">{line.tone === "add" ? "+" : line.tone === "del" ? "−" : " "}</span>
                <span className="min-w-0 truncate">{line.text}</span>
              </div>
            ))}
          </div>
        </div>,
        document.body,
      )}
    </div>
  );
}

/* ═══════════ TaskRows ═══════════ */
const TR_TICKS = [600, 900, 2400, 1400, 2400, 600];
function useTick(intervals) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    if (tick >= intervals.length - 1) return;
    const t = setTimeout(() => setTick((x) => x + 1), intervals[tick]);
    return () => clearTimeout(t);
  }, [tick, intervals]);
  return tick;
}
function SpinnerRing({ active, children }) {
  const size = 24, stroke = 2;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <span className="relative inline-flex shrink-0 items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="absolute inset-0" style={active ? { animation: "spin 1.1s linear infinite" } : undefined}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke} />
        {active && (
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--ink-3)" strokeWidth={stroke} strokeLinecap="round"
            strokeDasharray={`${c * 0.28} ${c * 0.72}`} />
        )}
      </svg>
      <span className="relative text-micro font-semibold tabular-nums text-ink">{children}</span>
    </span>
  );
}
function StatusDot({ tone, children }) {
  return (
    <span className={`flex size-5.5 shrink-0 items-center justify-center rounded-full text-canvas ${tone === "red" ? "bg-red" : "bg-green"}`}
      style={{ animation: "pop-in 300ms var(--ease-out-quint) both" }}>
      {children}
    </span>
  );
}
function StatusPill({ tone, children }) {
  return (
    <span className={`inline-flex h-5.5 items-center gap-1.5 rounded-full px-2 text-tiny font-medium ${tone === "red" ? "bg-red-tint text-red" : "bg-green-tint text-green"}`}
      style={{ animation: "fade-in 200ms ease-out both" }}>
      {children}
    </span>
  );
}
function TaskRows({ variant = "Capsules", rows: rowsProp }) {
  const tick = useTick(TR_TICKS);
  const [manualOpen, setManualOpen] = useState({});
  const demo = rowsProp === undefined;
  const draftStatus = tick < 3 ? "pending" : tick === 3 ? "failed" : "completed";
  const rows = rowsProp ?? [
    { key: "verify", label: "Verified vendor records", amount: "12 suppliers", status: "completed",
      details: [{ label: "Matched tax and contact IDs", meta: "12/12" }, { label: "Flagged stale records", meta: "0" }] },
    { key: "index", label: "Build reorder task list", amount: "7 SKUs", status: "active", step: 2,
      details: [{ label: "Reading POS export", meta: "3 files" }, { label: "Scoring stockout risk", meta: "68%" }] },
    { key: "draft", label: "Draft supplier emails", amount: "2 messages", status: draftStatus, step: 3,
      details: [{ label: "Cone supplier follow-up", meta: "draft" }, { label: "Pistachio reorder note", meta: "draft" }] },
  ];
  const badgeFor = (row) =>
    row.status === "completed" ? (
      <StatusDot tone="green"><Icon name="check" size={13} strokeWidth={3.5} /></StatusDot>
    ) : row.status === "failed" ? (
      <StatusDot tone="red"><Icon name="close" size={12} strokeWidth={3.5} /></StatusDot>
    ) : (
      <SpinnerRing active={row.status === "active"}>{row.step}</SpinnerRing>
    );
  const pillFor = (row) =>
    row.status === "completed" ? (
      <StatusPill tone="green">Completed</StatusPill>
    ) : row.status === "failed" ? (
      <StatusPill tone="red">
        Failed
        <span className="flex" style={{ animation: "spin 1.2s linear infinite" }}><Icon name="retry" size={12} strokeWidth={3} /></span>
      </StatusPill>
    ) : null;
  const list = variant === "List";
  return (
    <div className={`flex w-full max-w-110 flex-col ${list ? "gap-0 self-start overflow-hidden rounded-card bg-surface shadow-card" : "min-h-[196px] gap-2"}`}>
      {rows.map((row, i) => {
        const open = manualOpen[row.key] ?? (demo && row.key === "index" && tick === 2);
        return (
          <div key={row.key}
            className={`self-stretch overflow-hidden transition-[border-radius,background-color] duration-300 hover:bg-inset ${list ? "border-b border-line last:border-0" : "bg-surface shadow-card"}`}
            style={{ borderRadius: list ? 0 : open ? "var(--radius-card)" : "var(--radius-capsule)", animation: `fade-up 450ms var(--ease-out-quint) ${i * 80}ms both` }}>
            <button type="button" aria-expanded={open}
              onClick={() => setManualOpen((current) => ({ ...current, [row.key]: !open }))}
              className="flex h-11 w-full items-center gap-2.5 px-2.5 text-left">
              <span className="flex size-6 shrink-0 items-center justify-center">{badgeFor(row)}</span>
              <span className="min-w-0 flex-1 truncate text-body font-medium text-ink">{row.label}</span>
              <span className="text-caption text-ink-2 tabular-nums">{row.amount}</span>
              <span aria-live="polite" className="contents">{pillFor(row)}</span>
              <span aria-hidden="true" className="-ml-2 flex size-7 shrink-0 items-center justify-center rounded-full text-ink-3">
                <Icon name="chevron" size={15} className="transition-transform duration-300" style={{ transform: open ? "rotate(180deg)" : "rotate(0)" }} />
              </span>
            </button>
            <Disclosure open={open} live={demo}>
              <div className="mb-2.5 grid grid-cols-[24px_1fr] gap-2.5 px-2.5">
                <span aria-hidden className="mx-auto h-full w-px bg-line" />
                <div className="flex flex-col gap-1.5">
                  {row.details.map((d, j) => (
                    <div key={j} className="flex items-center justify-between"
                      style={open ? { animation: `fade-up 300ms var(--ease-out-quint) ${120 + j * 100}ms both` } : undefined}>
                      <span className="text-small text-ink-2">{d.label}</span>
                      <span className="font-mono text-tiny text-ink-3 tabular-nums">{d.meta}</span>
                    </div>
                  ))}
                </div>
              </div>
            </Disclosure>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════ Gallery ═══════════ */
function Section({ title, note, children }) {
  return (
    <section className="mb-10">
      <h2 className="text-title font-semibold text-ink">{title}</h2>
      {note && <p className="mt-0.5 text-caption text-ink-3">{note}</p>}
      <div className="mt-4 flex flex-wrap gap-6">{children}</div>
    </section>
  );
}
function Card({ label, wide, children }) {
  return (
    <div className={`rounded-card bg-surface p-5 shadow-card ${wide ? "w-full max-w-105" : ""}`}>
      <p className="mb-3 font-mono text-micro tracking-wide text-ink-3 uppercase">{label}</p>
      {children}
    </div>
  );
}
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem("ds-theme");
    if (stored === "light" || stored === "dark") return stored;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("ds-theme", theme);
  }, [theme]);
  return [theme, setTheme];
}
const PALETTES = [
  { id: "paper", label: "Paper", swatch: "#8a8a8a" },
  { id: "sage", label: "Sage", swatch: "#40724f" },
  { id: "twilight", label: "Twilight", swatch: "#4353d9" },
  { id: "clay", label: "Clay", swatch: "#a44a22" },
  { id: "ocean", label: "Ocean", swatch: "#0e7490" },
];
function usePalette() {
  const [palette, setPalette] = useState(() => localStorage.getItem("ds-palette") || "paper");
  useEffect(() => {
    if (palette === "paper") delete document.documentElement.dataset.palette;
    else document.documentElement.dataset.palette = palette;
    localStorage.setItem("ds-palette", palette);
  }, [palette]);
  return [palette, setPalette];
}
function App() {
  const [thinkKey, setThinkKey] = useState(0);
  const [theme, setTheme] = useTheme();
  const [palette, setPalette] = usePalette();
  return (
    <main className="mx-auto max-w-5xl px-6 py-10">
      <header className="mb-10 flex items-start justify-between gap-4">
        <div>
          <h1 className="text-display font-semibold tracking-tight text-ink">AI Design System</h1>
          <p className="mt-1 text-body text-ink-2">Live preview of every component built so far. Placeholder palette — swaps out when the real tokens land.</p>
        </div>
        <div className="flex shrink-0 items-center gap-2">
        <div className="flex items-center gap-1 rounded-control bg-surface p-1.5 shadow-btn">
          {PALETTES.map((p) => (
            <button
              key={p.id}
              type="button"
              title={p.label}
              aria-label={`${p.label} theme`}
              aria-pressed={palette === p.id}
              onClick={() => setPalette(p.id)}
              className="flex size-5 items-center justify-center rounded-full transition-transform duration-150 hover:scale-110"
              style={{
                background: p.swatch,
                boxShadow: palette === p.id
                  ? "0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink)"
                  : "inset 0 0 0 1px rgba(0,0,0,0.15)",
              }}
            />
          ))}
        </div>
        <button
          type="button"
          aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
          onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
          className="flex size-8 shrink-0 items-center justify-center rounded-control bg-surface text-ink-2 shadow-btn transition-colors duration-150 hover:bg-hover hover:text-ink"
        >
          {theme === "dark" ? (
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          ) : (
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          )}
        </button>
        </div>
      </header>
      <Section title="Primitives" note="The atoms everything above composes: Icon, Spinner, ShimmerLabel, Chip, DiffStat, IconButton, Disclosure.">
        <Card label="Primitives" wide>
          <div className="flex flex-wrap items-center gap-3">
            <ShimmerLabel>Shimmering</ShimmerLabel>
            <Spinner className="text-ink-2" />
            <Chip tone="field" mono>field chip</Chip>
            <Chip tone="surface" mono>surface chip</Chip>
            <Chip tone="inset" mono>inset chip</Chip>
            <DiffStat add={74} del={41} />
            <IconButton label="Close" className="text-ink-3 hover:bg-hover hover:text-ink"><Icon name="close" /></IconButton>
            <IconButton label="Search" className="text-ink-3 hover:bg-hover hover:text-ink"><Icon name="search" /></IconButton>
            <span className="flex items-center gap-1 text-ink-3"><Icon name="chevron" /><Icon name="check" /></span>
          </div>
        </Card>
      </Section>
      <Section title="Button" note="Four variants × two sizes; disabled and loading states. Click the loader to try it.">
        <Card label="Variants · sizes · states" wide><ButtonDemo /></Card>
      </Section>
      <Section title="LoadingState" note="Pixel-grid loader with shimmer label and elapsed timer.">
        <Card label="Drive"><LoadingState variant="Drive" /></Card>
        <Card label="Dots"><LoadingState variant="Dots" /></Card>
        <Card label="Orbit"><LoadingState variant="Orbit" /></Card>
      </Section>
      <Section title="ThinkingState" note="Expandable agent trace. Runs once on load — replay to see the sequence again.">
        <div className="w-full">
          <button type="button" onClick={() => setThinkKey((k) => k + 1)}
            className="mb-4 rounded-control bg-surface px-3 py-1.5 text-caption font-medium text-ink shadow-btn transition-colors duration-150 hover:bg-hover">
            ↻ Replay all
          </button>
          <div className="grid gap-6 md:grid-cols-2">
            <Card label="Steps"><ThinkingState key={`s${thinkKey}`} variant="Steps" /></Card>
            <Card label="Reasoning"><ThinkingState key={`r${thinkKey}`} variant="Reasoning" /></Card>
            <Card label="Search"><ThinkingState key={`w${thinkKey}`} variant="Search" /></Card>
            <Card label="Coding"><ThinkingState key={`c${thinkKey}`} variant="Coding" /></Card>
          </div>
        </div>
      </Section>
      <Section title="ApprovalCard" note="Human-in-the-loop questions — fully interactive, try answering.">
        <Card label="Default"><ApprovalCard /></Card>
      </Section>
      <Section title="TaskRows" note="Agent tasks as expandable rows — a scripted status run plays once (spin → failed → completed).">
        <Card label="Capsules" wide><TaskRows variant="Capsules" /></Card>
        <Card label="List" wide><TaskRows variant="List" /></Card>
      </Section>
      <Section title="ToolChips" note="Agent run as compact rows. Click rows to expand; hover the file chips for diff previews.">
        <Card label="Default"><ToolChips /></Card>
      </Section>
      <Section title="StreamingText" note="Words resolve out of blur; citations, sources, and follow-ups appear when done. Loops.">
        <Card label="Default" wide><StreamingText /></Card>
      </Section>
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
