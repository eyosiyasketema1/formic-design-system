<script>
  /* Apply the stored theme before first paint. useTheme sets this later from
     React, which is far too late — dark users would get a white flash. */
  try {
    var _t = localStorage.getItem("ds-theme");
    document.documentElement.dataset.theme = _t === "light" ? "light" : "dark";
    /* radius and size are applied here too, so a stored choice doesn't
       render one frame at default before React takes over */
    for (const [k, key] of [["radius", "ds-radius"], ["size", "ds-size"]]) {
      const v = localStorage.getItem(key);
      if (v && v !== "default") document.documentElement.dataset[k] = v;
    }
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>

   ring there is never a keyboard affordance, only noise on click. */

/* ── Global radius scale ───────────────────────────────── */
/* One knob for the whole system's corner language. Explicit token
   overrides per level rather than a calc() multiplier, so every value
   stays a real number you can read — the same mechanism palettes use. */
:root[data-radius="sharp"] {
  --radius-sm: 0px; --radius-chip: 0px; --radius-control: 0px;
  --radius-md: 0px; --radius-card: 0px; --radius-capsule: 0px;
}
:root[data-radius="rounded"] {
  --radius-sm: 8px; --radius-chip: 10px; --radius-control: 12px;
  --radius-md: 14px; --radius-card: 18px; --radius-capsule: 26px;
}
:root[data-radius="full"] {
  --radius-sm: 10px; --radius-chip: 999px; --radius-control: 999px;
  --radius-md: 14px; --radius-card: 20px; --radius-capsule: 999px;
}

/* ── Global size (density) scale ───────────────────────── */
/* Tailwind v4 derives every spacing and sizing utility from --spacing
   (0.25rem at root), so overriding that one value rescales all control
   heights, padding and gaps together — which is why rule 11 still holds
   at any density: a md button and a md input scale by the same factor.

   Type is deliberately NOT scaled: the ramp is fixed px by rule 2, so
   density changes without text becoming unreadable.

   The scale only goes UP on purpose. The xs control is exactly 24px,
   which is rule 15's touch-target floor, so any "compact" level would
   put the whole system in violation of its own rule. */
:root[data-size="comfortable"] { --spacing: 0.28rem; }
:root[data-size="spacious"] { --spacing: 0.3125rem; }

body { background: var(--canvas); color: var(--ink); font-family: "Urbanist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background-color 250ms ease, color 250ms ease; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* ─────────────────────────────────────────────────────────
 * RECORDS TABLE — component stylesheet
 * Import after tokens.css when using components/RecordsTable.
 * Everything reads tokens; light/dark/palettes come free.
 * ───────────────────────────────────────────────────────── */

.records-shell { position: relative; width: 100%; }
.records-shell.is-fill { height: 100%; }

.records-scroll {
  max-height: 480px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}
.records-shell.is-fill .records-scroll { max-height: none; height: 100%; }

.records-table {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  font-size: var(--text-caption);
}

/* ── headers ───────────────────────────────────────────── */
.records-header-cell {
  position: sticky;
  top: 0;
  z-index: 5;
  height: 36px;
  padding: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  text-align: left;
  font-weight: 500;
  font-size: var(--text-small);
  color: var(--ink-3);
  white-space: nowrap;
  user-select: none;
}
.records-header-cell:last-child { border-right: none; }
.records-header-cell.is-colsel { background: var(--inset); }

.records-header-button {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 35px;
  min-width: 0;
  padding: 0 10px;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 150ms, color 150ms;
}
.records-header-button:hover { background: var(--hover); color: var(--ink); }
.records-header-icon { display: flex; color: var(--ink-3); flex-shrink: 0; }

.records-sort {
  position: absolute;
  right: 26px;
  top: 50%;
  translate: 0 -50%;
  display: flex;
  padding: 3px;
  border-radius: 4px;
  color: var(--ink-3);
  cursor: pointer;
  opacity: 0;
  transition: opacity 150ms, transform 220ms var(--ease-out-quint), background-color 150ms;
}
.records-header-cell:hover .records-sort,
.records-sort:focus-visible { opacity: 0.6; }
.records-sort:hover { background: var(--hover); }
.records-sort.is-visible { opacity: 1 !important; color: var(--ink-2); }

.records-resize-handle {
  position: absolute;
  top: 0;
  right: -4px;
  width: 8px;
  height: 100%;
  cursor: col-resize;
  z-index: 6;
}
.records-resize-handle::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 0;
  width: 2px;
  height: 100%;
  background: transparent;
  transition: background-color 150ms;
}
.records-resize-handle:hover::after,
.records-resize-handle.is-resizing::after { background: var(--accent); }

/* ── cells ─────────────────────────────────────────────── */
.records-cell {
  height: 38px;
  padding: 0 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color 150ms;
}
.records-cell:last-child { border-right: none; }
.records-cell.is-colsel { background: var(--hover); }
.records-row:hover .records-cell { background: var(--hover); }
.records-row.is-selected .records-cell { background: var(--accent-tint); }

.records-sticky-cell { position: sticky; left: 0; z-index: 3; }
thead .records-sticky-cell { z-index: 7; }
tfoot .records-sticky-cell { z-index: 5; }

.records-company-header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 35px;
  padding: 0 10px;
}
.records-company-header-button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  padding: 2px 4px;
  margin: -2px -4px;
  border-radius: 4px;
  transition: background-color 150ms, color 150ms;
}
.records-company-header-button:hover { background: var(--hover); color: var(--ink); }
.records-company-cell { display: flex; align-items: center; gap: 8px; }
.records-rownum {
  width: 18px;
  flex-shrink: 0;
  text-align: right;
  font-size: var(--text-micro);
  font-variant-numeric: tabular-nums;
  color: var(--ink-3);
}
.records-company-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  background: var(--inset);
  box-shadow: 0 0 0 1px var(--line);
  font-size: var(--text-micro);
  font-weight: 600;
  color: var(--ink-2);
}
.records-company-name {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
}
.records-company-name.has-link:hover { text-decoration: underline; }

/* ── checkbox (appears on hover / when selected) ───────── */
.records-checkbox {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity 150ms;
}
.records-header-cell .records-checkbox,
.records-row:hover .records-checkbox,
.records-row.is-selected .records-checkbox,
.records-checkbox:focus-within { opacity: 1; }
.records-checkbox input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  margin: 0;
}
.records-checkbox-box {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 4px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--line-strong);
  color: var(--canvas);
  transition: background-color 150ms, box-shadow 150ms;
}
.records-checkbox-box.is-active { background: var(--accent); box-shadow: none; }
.records-checkbox input:focus-visible + .records-checkbox-box {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.records-checkbox-dash { width: 8px; height: 2px; border-radius: 1px; background: var(--canvas); }

/* ── tags — derived from one base hue per tag ──────────── */
.records-tags {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  height: 100%;
  overflow: hidden;
}
.records-tags-measure {
  position: absolute;
  display: flex;
  gap: 4px;
  visibility: hidden;
  pointer-events: none;
}
.records-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  font-size: var(--text-tiny);
  font-weight: 500;
  white-space: nowrap;
  background: color-mix(in srgb, var(--tag-base) 16%, var(--surface));
  color: color-mix(in srgb, var(--tag-base) 50%, var(--ink)); /* 50% keeps ≥4.5:1 on every hue */
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tag-base) 28%, transparent);
}
.records-more-tag {
  flex-shrink: 0;
  padding: 0 2px;
  font-size: var(--text-tiny);
  font-weight: 500;
  color: var(--ink-3);
}

/* ── cell content bits ─────────────────────────────────── */
.records-muted { color: var(--ink-3); }
.records-calc { display: inline-flex; align-items: center; gap: 8px; }
.records-pulse {
  width: 32px;
  height: 6px;
  border-radius: 999px;
  background-image: linear-gradient(90deg, var(--inset) 35%, var(--line-strong) 50%, var(--inset) 65%);
  background-size: 200% 100%;
  animation: shimmer-text 1.4s linear infinite;
}
.records-strength { display: inline-flex; align-items: center; gap: 7px; }
.records-strength-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 999px; }
.records-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  color: var(--ink-2);
  text-decoration: none;
  transition: color 150ms;
}
.records-link:hover { color: var(--ink); text-decoration: underline; }
.records-link-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* ── footer calculation row ────────────────────────────── */
.records-calculation-row .records-cell {
  position: sticky;
  bottom: 0;
  z-index: 4;
  height: 34px;
  border-bottom: none;
  border-top: 1px solid var(--line);
  font-size: var(--text-small);
  color: var(--ink-3);
}
.records-footer-value {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}
.records-calculation-number { color: var(--ink); font-weight: 600; }
.records-average { color: var(--ink-2); }
.records-add-calculation {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  color: var(--ink-3);
  cursor: pointer;
  opacity: 0;
  transition: opacity 150ms, color 150ms;
}
.records-calculation-row:hover .records-add-calculation { opacity: 1; }
.records-add-calculation:hover { color: var(--ink); }
.records-add-calculation:focus-visible { opacity: 1; }

/* ─────────────────────────────────────────────────────────
 * SIDEBAR NAV — component stylesheet
 * Import after tokens.css when using components/SidebarNav.
 *
 * Collapse model: the inner column keeps its full width; the
 * <aside> narrows and clips it. Copy fades + slides out, so
 * only the left-aligned icons remain in the collapsed rail.
 * ───────────────────────────────────────────────────────── */

.sidebar-copy {
  transition:
    opacity var(--sidebar-copy-duration) var(--sidebar-easing),
    transform var(--sidebar-copy-duration) var(--sidebar-easing);
}
[data-sidebar-collapsed="true"] .sidebar-copy {
  opacity: 0;
  transform: translateX(calc(var(--sidebar-copy-offset) * -1));
  pointer-events: none;
}

.sidebar-workspace-control,
.sidebar-collapse-control {
  transition:
    opacity var(--sidebar-copy-duration) var(--sidebar-easing),
    background-color 150ms, color 150ms, transform 150ms;
}
[data-sidebar-collapsed="true"] .sidebar-workspace-control,
[data-sidebar-collapsed="true"] .sidebar-collapse-control {
  opacity: 0;
  pointer-events: none;
}

.sidebar-expand-control {
  opacity: 0;
  pointer-events: none;
  transition:
    opacity var(--sidebar-copy-duration) var(--sidebar-easing),
    background-color 150ms, color 150ms;
}
[data-sidebar-collapsed="true"] .sidebar-expand-control {
  opacity: 1;
  pointer-events: auto;
}

/* rows shrink to icon squares when collapsed — the highlight follows,
   so the active state reads as a compact square around the icon */
.sidebar-row { width: 208px; }
[data-sidebar-collapsed="true"] .sidebar-row { width: 36px; }
.sidebar-glide-highlight { left: 8px; width: 208px; }
[data-sidebar-collapsed="true"] .sidebar-glide-highlight { width: 36px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

     all, not even a background. This page also hands Babel 336KB of
     inline JSX to compile synchronously, which stalls the main thread
     long enough for the fully-rendered but completely unstyled gallery
     to be painted as raw text. So: hold the app back until the utilities
     genuinely resolve, and show a spinner meanwhile. */

  html[data-theme="dark"] { --boot-bg: #131312; --boot-fg: #7a7a75; --boot-line: #2a2a28; }
  html { background: var(--boot-bg); }

     This animation is a pure-CSS deadline: if the script below throws or
     never runs, the content still appears at 9s instead of leaving a
     permanently blank page, which would be worse than the bug it fixes. */

  @keyframes boot-failsafe { to { opacity: 1; } }
  html.tw-ready #root { opacity: 1; animation: none; transition: opacity 160ms ease-out; }

  #boot {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: var(--boot-bg); color: var(--boot-fg);
    font: 500 13px/1 Urbanist, ui-sans-serif, system-ui, sans-serif;
  }

    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--boot-line); border-top-color: var(--boot-fg);

     finishes. Gives up after 8s so a CDN failure degrades to unstyled

      if (done) return;
      done = true;
      html.classList.add("tw-ready");

       are declared inside the tailwindcss block itself, so --ink reads
       empty until it compiles, regardless of which utilities Tailwind
       decided to generate. Same probe as index.html. */

       alone showed a blank page while Babel was still compiling the app. */

    setPreview({

            {submitted}

          <div className="flex items-center justify-end">

      viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true"
      className={`h-8 w-full overflow-visible ${SERIES_TEXT[color]} ${className}`}
      /* The reveal clips the whole svg left→right. A stroke-dash draw-in
         (pathLength + dasharray) breaks under non-scaling-stroke in Chromium
         and showed up as a line with holes in it. */
      style={drawing ? { animation: "reveal-x 1700ms var(--ease-out-quint) both" } : undefined}
    >
      {area && (
        <>
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="currentColor" stopOpacity="0.24" />
              <stop offset="100%" stopColor="currentColor" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${d} L${W} ${H} L0 ${H} Z`} fill={`url(#${gradientId})`} />
        </>
      )}
      <path
        d={d} fill="none" stroke="currentColor" strokeWidth="2"
        strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"
      />
    </svg>
  );
}

function CountUp({
  value,
  duration = 1400,
  format = (n) => n.toLocaleString(),
}) {
  const reduced = useReducedMotion();
  const [shown, setShown] = useState(reduced ? value : 0);
  useEffect(() => {
    if (reduced || duration <= 0) { setShown(value); return; }
    const from = shown, t0 = performance.now();
    let raf = 0;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setShown(Math.round(from + (value - from) * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, reduced, duration]);
  return <span className="tabular-nums">{format(reduced ? value : shown)}</span>;
}

function Gauge({
  percent = 64,
  label = "of people become clients",
  ticks = 36,
  animate = true,
  className = "",
}) {
  const { drawing } = useEntrance(animate);
  const p = Math.max(0, Math.min(100, percent));
  /* Two ticks is the floor — a lone tick has no arc to sit on. */
  const n = Math.max(2, Math.round(ticks));
  const lit = Math.round((p / 100) * n);
  const START = 150, SWEEP = 240, CX = 110, CY = 96, R1 = 74, R2 = 92;
  return (
    <div className={`relative mx-auto w-full max-w-55 ${className}`} role="img" aria-label={`${Math.round(p)} percent ${label}`}>
      <svg viewBox="0 0 220 150" className="block w-full" aria-hidden="true">
        {Array.from({ length: n }, (_, i) => {
          const a = ((START + (i / (n - 1)) * SWEEP) * Math.PI) / 180;
          const on = i < lit;
          return (
            <line
              key={i}
              x1={CX + R1 * Math.cos(a)} y1={CY + R1 * Math.sin(a)}
              x2={CX + R2 * Math.cos(a)} y2={CY + R2 * Math.sin(a)}
              strokeWidth="4" strokeLinecap="round"
              className={on ? "stroke-accent" : "stroke-chart-track"}
              style={on && drawing ? { animation: `fade-in 300ms var(--ease-out-quint) ${i * 34}ms both` } : undefined}
            />
          );
        })}
      </svg>
      <div className="absolute inset-x-0 top-[38%] text-center">
        <p className="text-display-lg font-semibold text-ink">{drawing ? <CountUp value={Math.round(p)} /> : Math.round(p)}%</p>
        <p className="mt-1 text-small text-ink-3">{label}</p>
      </div>
    </div>
  );
}

const DEFAULT_BARS = [
  { label: "Brand Identity", value: 48 }, { label: "Website", value: 31 },
  { label: "Company Profile", value: 24 }, { label: "Graphic Design", value: 17 },
];
function BarList({
  items = DEFAULT_BARS,
  max,
  format = (n) => n.toLocaleString(),
  stagger = 90,
  fill = false,
  animate = true,
  className = "",
}) {
  const { settled: on, drawing } = useEntrance(animate);
  const ceiling = max ?? Math.max(1, ...items.map((i) => i.value));
  return (
    <div className={`flex w-full flex-col gap-2.5 ${fill ? "h-full justify-between" : ""} ${className}`}>
      {items.map((item, i) => {
        const pct = Math.max(2, (item.value / ceiling) * 100);
        const leader = i === 0;
        return (
          <div key={`${item.label}-${i}`} className="flex items-center gap-3">
            <span className={`w-28 shrink-0 truncate text-caption sm:w-36 ${leader ? "font-medium text-ink" : "text-ink-2"}`} title={item.label}>
              {item.label}
            </span>
            <div className="relative h-2.5 min-w-0 flex-1 overflow-hidden rounded-sm bg-chart-track">
              {/* scaleX composites on the GPU; animating width relays out every frame */}
              <div
                className={`absolute inset-y-0 left-0 origin-left rounded-sm ${leader ? "bg-accent" : "bg-ink-3"}`}
                style={{
                  width: `${pct}%`,
                  transform: on ? "scaleX(1)" : "scaleX(0)",
                  transition: drawing ? `transform 1400ms var(--ease-out-quint) ${i * stagger}ms` : undefined,
                }}
              />
            </div>
            <span className="w-14 shrink-0 text-right text-caption font-semibold text-ink tabular-nums">{format(item.value)}</span>
          </div>
        );
      })}
    </div>
  );
}

function Masked({ children, placeholder = "•••••" }) {
  const { shown } = useContext(PrivacyCtx);

  return (

const APPSB_WORKSPACE = { name: "Formic Studio", logo: <FormicMark size={22} className="text-accent" /> };
const APPSB_SECTIONS = [
  {
    items: [
      { key: "overview", label: "Overview", icon: "home" },
      {
        key: "reports", label: "Reports", icon: "chart", count: "12",
        children: [
          { key: "reports-sales", label: "Sales", count: "5" },
          { key: "reports-customers", label: "Customers", count: "4" },
          { key: "reports-products", label: "Products", count: "3" },
        ],
      },
      { key: "records", label: "Records", icon: "file" },
    ],
  },
  {
    title: "Workspace",
    items: [
      { key: "people", label: "People", icon: "user-add", count: "8" },
      { key: "integrations", label: "Integrations", icon: "layers" },
      { key: "notifications", label: "Notifications", icon: "bell", count: "3" },
      { key: "settings", label: "Settings", icon: "gear" },
    ],
  },
];
const APPSB_USER = { name: "Eyosiyas Ketema", detail: "Admin" };
function AppSidebar({
  workspace = APPSB_WORKSPACE,
  sections = APPSB_SECTIONS,
  active,
  onSelect,
  variant,
  defaultVariant = "expanded",
  onVariantChange,
  collapsible = true,
  submenus = "nested",
  user = APPSB_USER,
  footer,
  className = "",
}) {
  const [own, setOwn] = useState(defaultVariant);
  const mode = variant ?? own;
  const rail = mode === "rail";
  const flip = () => {
    const next = rail ? "expanded" : "rail";
    if (variant === undefined) setOwn(next);
    onVariantChange?.(next);
  };
  /* A controlled variant with no handler cannot flip, so the control is
     not drawn rather than drawn dead. */
  const canFlip = collapsible && (variant === undefined || Boolean(onVariantChange));
  const current = active === null ? undefined : (active ?? sections[0]?.items[0]?.key);
  const parentOf = (key) =>
    sections.flatMap((s) => s.items).find((i) => i.children?.some((c) => c.key === key))?.key;
  const activeParent = parentOf(current);

  /* Expanded: which groups are open. The active child's group starts open. */
  const [openGroups, setOpenGroups] = useState(() => (activeParent ? { [activeParent]: true } : {}));
  useEffect(() => {
    if (activeParent) setOpenGroups((o) => (o[activeParent] ? o : { ...o, [activeParent]: true }));
  }, [activeParent]);
  const toggleGroup = (key) => setOpenGroups((o) => ({ ...o, [key]: !o[key] }));

  /* Rail: one flyout at a time, placed beside the icon that opened it. */
  const flyoutId = useId();
  const [flyout, setFlyout] = useState(null);
  useEffect(() => {
    if (!flyout) return;
    const onDown = (event) => {
      const layer = document.getElementById(flyoutId);
      if (layer && !layer.containsevent.target) setFlyout(null);
    };
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [flyout, flyoutId]);
  useEffect(() => { if (!rail) setFlyout(null); }, [rail]);

  const pick = (key) => {
    setFlyout(null);
    onSelect?.(key);
  };

  /* Rail rows are fixed 36px squares, centred by their wrapper. They cannot
     be w-full: the Tooltip's anchor is an inline span, so w-full would fill
     nothing and the icon would sit at the left edge with a shrunken pill. */
  const rowClass = (on) =>
    `relative z-10 flex h-9 items-center rounded-control transition-colors duration-150 ${rail ? "w-9 justify-center" : "w-full gap-2.5 px-2.5"} ${on ? "bg-hover-2 text-ink" : "text-ink-2 hover:text-ink"}`;

  /* One row, both variants: in the rail the label and count are not
     rendered at all (a tooltip carries the name), so the icon square is
     the whole hit area and stays exactly where it was — collapsing never
     shifts the icons. */
  const row = (item) => {
    const group = submenus === "nested" && Boolean(item.children?.length);
    const on = item.key === current || (group && item.key === activeParent);
    const expanded = Boolean(openGroups[item.key]);
    const onClick = (event) => {
      if (!group) return pick(item.key);
      if (!rail) return toggleGroup(item.key);
      /* Anchor x to the aside's edge, not the 36px button, so the flyout
         clears the rail instead of overlapping it. */
      const r = event.currentTarget.getBoundingClientRect();
      const edge = event.currentTarget.closest("aside")?.getBoundingClientRect().right ?? r.right;
      setFlyout((f) => (f?.key === item.key ? null : { key: item.key, x: edge + 6, top: r.top }));
    };
    const button = (
      <button
        type="button"
        data-menu-row
        aria-current={!group && on ? "page" : undefined}
        aria-expanded={group ? (rail ? flyout?.key === item.key : expanded) : undefined}
        aria-haspopup={group && rail ? "menu" : undefined}
        aria-controls={group && rail && flyout?.key === item.key ? flyoutId : undefined}
        aria-label={rail ? item.label : undefined}
        onClick={onClick}
        className={rowClass(on)}
      >
        <Icon name={item.icon} size={16} strokeWidth={2} className="shrink-0" />
        {!rail && <span className="min-w-0 flex-1 truncate text-left text-body font-medium">{item.label}</span>}
        {!rail && item.count && <span className="shrink-0 text-small font-medium text-ink-3 tabular-nums">{item.count}</span>}
        {!rail && group && (
          <Icon name="chevron" size={14} strokeWidth={2} className={`shrink-0 text-ink-3 transition-transform duration-150 ${expanded ? "rotate-180" : ""}`} />
        )}
      </button>
    );
    const head = rail ? <Tooltip label={item.label}>{button}</Tooltip> : button;
    if (!group || rail) return <div key={item.key} className={rail ? "flex justify-center" : ""}>{head}</div>;
    return (
      <div key={item.key}>
        {head}
        <Disclosure open={expanded} duration={220}>
          {/* children sit on a hairline that starts under the parent's icon,
              so the indent reads as hierarchy rather than a second list */}
          <div className="mt-0.5 ml-4.5 flex flex-col gap-0.5 border-l border-line pl-3">
            {item.children.map((child) => {
              const childOn = child.key === current;
              return (
                <button
                  key={child.key}
                  type="button"
                  data-menu-row
                  aria-current={childOn ? "page" : undefined}
                  onClick={() => pick(child.key)}
                  className={`relative z-10 flex h-8 w-full items-center gap-2 rounded-control px-2 transition-colors duration-150 ${childOn ? "bg-hover-2 text-ink" : "text-ink-2 hover:text-ink"}`}
                >
                  <span className="min-w-0 flex-1 truncate text-left text-caption font-medium">{child.label}</span>
                  {child.count && <span className="shrink-0 text-small text-ink-3 tabular-nums">{child.count}</span>}
                </button>
              );
            })}
          </div>
        </Disclosure>
      </div>
    );
  };

  const flyoutItem = flyout ? sections.flatMap((s) => s.items).find((i) => i.key === flyout.key) : undefined;

  return (
    <aside
      aria-label="Primary"
      data-variant={mode}
      className={`flex h-full shrink-0 flex-col border-r border-line bg-sidebar transition-[width] duration-300 ${rail ? "w-14" : "w-60"} ${className}`}
      style={{ transitionTimingFunction: "var(--ease-out-quint)" }}
    >
      {/* Header: workspace mark, and the collapse / expand control in the
          same place in both variants, so the eye knows where to go back. */}
      <div className={`flex shrink-0 ${rail ? "flex-col items-center gap-1 py-2.5" : "h-14 items-center gap-2 px-3"}`}>
        {workspace.logo ? (
          <span className="flex size-7 shrink-0 items-center justify-center">{workspace.logo}</span>
        ) : (
          <span className="flex size-7 shrink-0 items-center justify-center rounded-sm bg-ink text-small font-semibold text-canvas">
            {workspace.monogram ?? workspace.name.slice(0, 1)}
          </span>
        )}
        {!rail && <span className="min-w-0 flex-1 truncate text-body font-semibold text-ink">{workspace.name}</span>}
        {canFlip && (
          rail ? (
            <Tooltip label="Expand sidebar">
              <IconButton label="Expand sidebar" onClick={flip} className="size-9 text-ink-3 hover:bg-hover-2 hover:text-ink">
                <Icon name="sidebar" size={15} strokeWidth={2} className="rotate-180" />
              </IconButton>
            </Tooltip>
          ) : (
            <IconButton label="Collapse sidebar" onClick={flip} className="text-ink-3 hover:bg-hover-2 hover:text-ink">
              <Icon name="sidebar" size={15} strokeWidth={2} />
            </IconButton>
          )
        )}
      </div>

      <nav className={`min-h-0 flex-1 overflow-y-auto ${rail ? "px-2" : "px-2.5"}`}>
        {sections.map((section, si) => (
          <div key={section.title ?? si} className={si ? "mt-4" : ""}>
            {section.title && !rail && (
              <p className="mb-1 px-2.5 text-micro font-medium tracking-wide text-ink-3 uppercase">{section.title}</p>
            )}
            {section.title && rail && si > 0 && <div className="mx-2 mb-2 border-t border-line" />}
            <GlideMenu className="flex flex-col gap-0.5" highlightClassName={rail ? "left-1/2 w-9 -translate-x-1/2 rounded-control bg-hover" : "inset-x-0 rounded-control bg-hover"}>
              {section.items.map(row)}
            </GlideMenu>
          </div>
        ))}
      </nav>

      {/* Rail flyout for a group: the sub-menu beside its icon */}
      {rail && flyout && flyoutItem?.children && (
        <Popover id={flyoutId} role="menu" x={flyout.x} top={flyout.top} className="w-52" onClose={() => setFlyout(null)}>
          <div className="p-1.5">
            <p className="px-2 pb-1 pt-1 text-micro font-medium tracking-wide text-ink-3 uppercase">{flyoutItem.label}</p>
            <GlideMenu className="flex flex-col gap-0.5" highlightClassName="inset-x-0 rounded-sm bg-hover">
              {flyoutItem.children.map((child) => {
                const childOn = child.key === current;
                return (
                  <button
                    key={child.key}
                    type="button"
                    role="menuitem"
                    data-menu-row
                    aria-current={childOn ? "page" : undefined}
                    onClick={() => pick(child.key)}
                    className={`relative z-10 flex h-8 w-full items-center gap-2 rounded-sm px-2 text-left transition-colors duration-150 ${childOn ? "bg-hover-2 text-ink" : "text-ink-2 hover:text-ink"}`}
                  >
                    <span className="min-w-0 flex-1 truncate text-caption font-medium">{child.label}</span>
                    {child.count && <span className="shrink-0 text-small text-ink-3 tabular-nums">{child.count}</span>}
                  </button>
                );
              })}
            </GlideMenu>
          </div>
        </Popover>
      )}

      <div className={`mt-auto shrink-0 border-t border-line ${rail ? "flex flex-col items-center py-2" : "p-2.5"}`}>
        {footer !== undefined ? footer : user && (

/* ── runtime accent (components/theme.ts mirror) ── */
const TH_OVERRIDE_ID = "ds-accent-override";
const TH_LIGHT_ANCHOR = "#ffffff";
const TH_DARK_ANCHOR = "#262626";
/* The 10% accent tint sits on each palette's light --surface, none of which
   is pure white (ocean is #fbfdfd, the darkest). Fitting the tint against
   the darkest surface makes the result hold on every palette. */
const TH_TINT_SURFACE_ANCHOR = "#fbfdfd";
const TH_MIN_CONTRAST = 4.5;
function TH_hexToRgb(hex) {
  const match = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!match) return null;
  const value = parseInt(match[1], 16);
  return { r: value >> 16 & 255, g: value >> 8 & 255, b: value & 255 };
}
const TH_toHex = ({ r, g, b }) => `#${[r, g, b].map((channel) => Math.round(channel).toString(16).padStart(2, "0")).join("")}`;
function TH_luminance({ r, g, b }) {
  const channel = (value) => {
    const scaled = value / 255;
    return scaled <= 0.03928 ? scaled / 12.92 : ((scaled + 0.055) / 1.055) ** 2.4;
  };
  return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
}
function TH_contrast(a, b) {
  const la = TH_luminance(a);
  const lb = TH_luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function TH_rgbToHsl({ r, g, b }) {
  const rn = r / 255;
  const gn = g / 255;
  const bn = b / 255;
  const max = Math.max(rn, gn, bn);
  const min = Math.min(rn, gn, bn);
  const l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l };
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === rn ? ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6 : max === gn ? ((bn - rn) / d + 2) / 6 : ((rn - gn) / d + 4) / 6;
  return { h, s, l };
}
function TH_hslToRgb({ h, s, l }) {
  if (s === 0) return { r: l * 255, g: l * 255, b: l * 255 };
  const hue = (p2, q2, t) => {
    let tn = t;
    if (tn < 0) tn += 1;
    if (tn > 1) tn -= 1;
    if (tn < 1 / 6) return p2 + (q2 - p2) * 6 * tn;
    if (tn < 1 / 2) return q2;
    if (tn < 2 / 3) return p2 + (q2 - p2) * (2 / 3 - tn) * 6;
    return p2;
  };
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
  const p = 2 * l - q;
  return {
    r: hue(p, q, h + 1 / 3) * 255,
    g: hue(p, q, h) * 255,
    b: hue(p, q, h - 1 / 3) * 255
  };
}
function TH_mixRgb(a, b, weight) {
  return {
    r: Math.round(a.r * weight + b.r * (1 - weight)),
    g: Math.round(a.g * weight + b.g * (1 - weight)),
    b: Math.round(a.b * weight + b.b * (1 - weight)),
  };
}
function TH_fitContrast(color, anchor, direction) {
  const hsl = TH_rgbToHsl(color);
  let rounded = color;
  for (let step = 0; step <= 100; step += 1) {
    const candidate = TH_hslToRgb({
      ...hsl,
      l: Math.min(1, Math.max(0, hsl.l + direction * step * 0.01))
    });
    rounded = {
      r: Math.round(candidate.r),
      g: Math.round(candidate.g),
      b: Math.round(candidate.b)
    };
    /* Light accents must also hold on their own 10% tint (accent-soft
       buttons, lead tiles), which is always the harder test — so that is
       the anchor when darkening. Dark accents sit on the dark anchor. */
    const target = direction < 0 ? TH_mixRgb(rounded, TH_hexToRgb(TH_TINT_SURFACE_ANCHOR), 0.1) : anchor;
    if (TH_contrast(rounded, target) >= TH_MIN_CONTRAST) return rounded;
  }
  return rounded;
}
function deriveAccentVariants(color) {
  const rgb = TH_hexToRgb(color);
  if (!rgb) return null;
  const lightAnchor = TH_hexToRgb(TH_LIGHT_ANCHOR);
  const darkAnchor = TH_hexToRgb(TH_DARK_ANCHOR);
  return {
    light: TH_toHex(TH_fitContrast(rgb, lightAnchor, -1)),
    dark: TH_toHex(TH_fitContrast(rgb, darkAnchor, 1))
  };
}
function setAccent(color) {
  if (typeof document === "undefined") return null;
  const existing = document.getElementById(TH_OVERRIDE_ID);
  if (!color) {
    existing?.remove();
    return null;
  }
  const variants = deriveAccentVariants(color);
  if (!variants) return null;
  const element = existing ?? document.createElement("style");
  element.id = TH_OVERRIDE_ID;
  element.textContent = `:root:root:root:root { --accent: ${variants.light}; }
:root:root:root:root[data-theme="dark"] { --accent: ${variants.dark}; }`;
  if (!existing) document.head.appendChild(element);
  return variants;
}
function useAccent() {
  const [accent, setAccentState] = useState(() => { try { return localStorage.getItem("ds-accent") || ""; } catch { return ""; } });
  useEffect(() => {
    setAccent(accent || null);
    try { accent ? localStorage.setItem("ds-accent", accent) : localStorage.removeItem("ds-accent"); } catch {}
  }, [accent]);
  return [accent, setAccentState];
}

    aria-valuemin={0}
    aria-valuemax={100}
    onPointerDown={onSquareDown}
    onPointerMove={onSquareMove}
    onKeyDown={onSquareKey}
    className="corner-smooth relative aspect-[4/3] w-full cursor-crosshair touch-none overflow-hidden rounded-control"
    style={{
      background: `linear-gradient(to top, #000000, transparent), linear-gradient(to right, #ffffff, ${hueHex})`
    }}
  >
        <span
    aria-hidden
    className="absolute size-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-surface"
    style={{ left: `${hsv.s * 100}%`, top: `${(1 - hsv.v) * 100}%`, background: current, boxShadow: "var(--shadow-overlay)" }}
  />
      </div>

      {
    /* hue */
  }
      <input
    type="range"
    min={0}
    max={360}
    step={1}
    value={Math.round(hsv.h)}
    aria-label="Hue"
    onChange={(e) => commit({ ...hsv, h: Number(e.target.value) })}
    className="color-picker-hue w-full"
    style={{ background: "linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)" }}
  />

      {
    /* hex + eyedropper */
  }
      <div className="flex items-center gap-2">
        <span className="corner-smooth flex h-8 min-w-0 flex-1 items-center gap-1.5 rounded-control bg-field px-2.5 transition-colors duration-150 focus-within:bg-hover-2">
          <span aria-hidden className="size-3.5 shrink-0 rounded-full" style={{ background: current, boxShadow: "var(--shadow-overlay)" }} />
          <span className="font-mono text-caption text-ink-3">#</span>
          <input
    id={`${id}-hex`}
    aria-label="Hex colour"
    value={text.replace(/^#/, "")}
    onChange={(e) => onTextChange(e.target.value)}
    onBlur={() => {
      if (!isHex(text)) setText(current.toUpperCase());
    }}
    spellCheck={false}
    maxLength={6}
    className="min-w-0 flex-1 bg-transparent font-mono text-caption text-ink uppercase outline-none"
  />
        </span>
        {eyedropper && <IconButton label="Pick a colour from the screen" onClick={pick} className="size-8 rounded-control bg-field text-ink-2 hover:bg-hover-2 hover:text-ink">
            <Icon name="edit" size={14} strokeWidth={2} />
          </IconButton>}
      </div>

      {
    /* swatches */
  }
      {swatches.length > 0 && <div className="flex flex-wrap gap-1.5" role="group" aria-label="Swatches">
          {swatches.map((hex) => {
    const on = hex.toLowerCase() === current.toLowerCase();
    return <button
      key={hex}
      type="button"
      aria-label={hex}
      aria-pressed={on}
      onClick={() => onTextChange(hex)}
      className="corner-smooth size-6 rounded-control transition-transform duration-150 hover:scale-110"
      style={{ background: hex, boxShadow: on ? "0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink)" : "var(--shadow-overlay)" }}
    />;
  })}
        </div>}
    </div>;
}

const PAGE_INDEX = Object.fromEntries(PAGES.map((p, i) => [p.id, i]));

/* ═══════════ Global knobs: radius + size (mirror the data-* token scales) ═══════════ */
function useRootAttr(key, storageKey, fallback) {
  const [value, setValue] = useState(() => { try { return localStorage.getItem(storageKey) || fallback; } catch { return fallback; } });
  useEffect(() => {
    if (value === fallback) delete document.documentElement.dataset[key];
    else document.documentElement.dataset[key] = value;
    try { value === fallback ? localStorage.removeItem(storageKey) : localStorage.setItem(storageKey, value); } catch {}
  }, [value]);
  return [value, setValue];
}
function useRadius() { return useRootAttr("radius", "ds-radius", "default"); }
function useSize() { return useRootAttr("size", "ds-size", "default"); }

/* ═══════════ Routing: #/button — legacy #button anchors still resolve ═══════════ */
function readRoute() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  return PAGE_INDEX[raw] !== undefined ? raw : PAGES[0].id;
}
function useRoute() {
  const [route, setRoute] = useState(readRoute);
  useEffect(() => {
    const onHash = () => {
      const next = readRoute();
      // normalise old-style #button to #/button so the address bar is canonical
      if (location.hash && !location.hash.startsWith("#/") && PAGE_INDEX[location.hash.slice(1)] !== undefined) {
        history.replaceState(null, "", `#/${location.hash.slice(1)}`);
      }
      setRoute(next);
      window.scrollTo({ top: 0 });
      const title = PAGES[PAGE_INDEX[next]]?.title;
      if (title) document.title = `${title} · Formic AI Design System`;
      /* Focus follows the navigation, so keyboard and screen-reader users
         land on the new page's heading instead of staying on the rail link. */
      requestAnimationFrame(() => document.getElementById("page-title")?.focus({ preventScroll: true }));
    };
    window.addEventListener("hashchange", onHash);
    onHash();
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}

/* ═══════════ Playground engine ═══════════ */
/* A schema is a list of controls; the engine keeps one state object and
   hands it to `render` as props. Kept deliberately small: select, text,
   number, toggle. Anything a knob can't express stays in the demos. */
function usePlayground(schema, resetKey) {
  const initial = Object.fromEntries(schema.map((c) => [c.key, c.value]));
  const [store, setStore] = useState({ key: resetKey, values: initial });
  /* Derive-from-props reset: when the page changes, swap state DURING this
     render rather than in an effect. An effect reset leaves one committed
     frame where the previous page's values reach the new component — a
     chip's tone:"field" landing on Alert throws, and with no error
     boundary that is a white screen. React re-renders before commit here. */
  let values = store.values;
  if (store.key !== resetKey) {
    values = initial;
    setStore({ key: resetKey, values: initial });
  }
  const set = (key, value) => setStore((st) => ({ key: st.key, values: { ...st.values, [key]: value } }));
  const reset = () => setStore({ key: resetKey, values: initial });
  return [values, set, reset];
}
function ControlRow({ label, children }) {
  return (
    <div className="flex min-h-8 items-center justify-between gap-3">
      <span className="text-caption text-ink-2">{label}</span>
      <div className="flex min-w-0 items-center justify-end">{children}</div>
    </div>
  );
}
function RailSelect({ value, options, onChange, ariaLabel }) {
  return (
    <div className="relative">
      <select aria-label={ariaLabel} value={value} onChange={(e) => onChange(e.target.value)}
        className="corner-smooth h-7 cursor-pointer appearance-none rounded-control bg-transparent pr-6 pl-2 text-caption font-medium text-ink outline-none hover:bg-hover">
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
      <span className="pointer-events-none absolute top-1/2 right-1.5 -translate-y-1/2 text-ink-3"><Icon name="chevron" size={13} strokeWidth={2} /></span>
    </div>
  );
}
function PlaygroundControls({ schema, state, set }) {
  return (
    <div className="flex flex-col gap-1">
      {schema.map((c) => {
        if (c.heading) return <p key={c.heading} className="mt-3 mb-1 text-caption font-semibold text-ink first:mt-0">{c.heading}</p>;
        if (c.type === "select") return (
          <ControlRow key={c.key} label={c.label}>
            <RailSelect ariaLabel={c.label} value={String(state[c.key])} options={c.options.map(String)} onChange={(v) => set(c.key, typeof c.value === "number" ? Number(v) : v)} />
          </ControlRow>
        );
        if (c.type === "toggle") return (
          <ControlRow key={c.key} label={c.label}>
            <Switch on={!!state[c.key]} onToggle={() => set(c.key, !state[c.key])} size="sm" label={c.label} />
          </ControlRow>
        );
        if (c.type === "number") return (
          <ControlRow key={c.key} label={c.label}>
            <span className="corner-smooth rounded-control bg-field transition-colors duration-150 focus-within:bg-hover-2">
              <input type="number" aria-label={c.label} value={state[c.key]} min={c.min} max={c.max} step={c.step ?? 1}
                onChange={(e) => set(c.key, Number(e.target.value))}
                className="h-7 w-20 bg-transparent px-2 text-right text-caption text-ink tabular-nums outline-none" />
            </span>
          </ControlRow>
        );
        return (
          <ControlRow key={c.key} label={c.label}>
            <span className="corner-smooth rounded-control bg-field transition-colors duration-150 focus-within:bg-hover-2">
              <input type="text" aria-label={c.label} value={state[c.key]} onChange={(e) => set(c.key, e.target.value)}
                className="h-7 w-32 bg-transparent px-2 text-right text-caption text-ink outline-none" />
            </span>
          </ControlRow>
        );
      })}
    </div>
  );
}

    render: (p) => <LoadingState variant={p.variant} label={p.label} />,

  avatar: {
    schema: [

      { key: "size", label: "Size", type: "select", value: "lg", options: ["sm", "md", "lg", "xl"] },
      { key: "tone", label: "Tone", type: "select", value: 0, options: [0, 1, 2, 3] },

  panel: {
    schema: [

      { key: "caption", label: "Caption", type: "text", value: "Top purchasing regions" },
      { key: "actions", label: "Action", type: "toggle", value: true },

      { key: "fill", label: "Body fills", type: "toggle", value: true },

      <div className="h-80 w-full max-w-120">

  appsidebar: {

      { key: "user", label: "Account row", type: "toggle", value: true },
      { key: "active", label: "Active", type: "select", value: "reports-sales", options: ["overview", "reports-sales", "reports-customers", "records", "people", "settings"] },

  },
  statcard: {
    schema: [
      { key: "label", label: "Label", type: "text", value: "Total income" },
      { key: "display", label: "Value", type: "text", value: "$4,673" },
      { key: "caption", label: "Caption", type: "text", value: "Last week" },
      { key: "delta", label: "Delta", type: "text", value: "+25.2%" },
      { key: "deltaTone", label: "Direction", type: "select", value: "up", options: ["up", "down", "flat"] },
      { key: "icon", label: "Icon", type: "toggle", value: true },
      { key: "iconTone", label: "Icon tone", type: "select", value: "neutral", options: ["neutral", "accent"] },
      { key: "trend", label: "Sparkline", type: "toggle", value: true },
      { key: "trendSmooth", label: "Smooth trend", type: "toggle", value: false },
    ],
    render: (p) => (
      <StatCard label={p.label} display={p.display} caption={p.caption} delta={p.delta} deltaTone={p.deltaTone}
        icon={p.icon ? "chart" : undefined} iconTone={p.iconTone} trend={p.trend ? [3, 6, 4, 9, 7, 11, 10, 14] : undefined} trendTone={p.iconTone} trendSmooth={p.trendSmooth} />
    ),
  },
  charts: {
    schema: [
      { key: "chart", label: "Chart", type: "select", value: "Bar", options: ["Bar", "Line", "Donut"] },
      { key: "fill", label: "Fill a panel", type: "toggle", value: false },
      { key: "animate", label: "Motion", type: "toggle", value: true },
      { heading: "Bar" },
      { key: "variant", label: "Variant", type: "select", value: "grouped", options: ["grouped", "stacked"] },
      { key: "series", label: "Series", type: "select", value: 1, options: [1, 2, 3] },
      { key: "highlight", label: "Highlight Feb", type: "toggle", value: true },
      { key: "showValues", label: "Values", type: "toggle", value: true },
      { heading: "Line" },
      { key: "area", label: "Area fill", type: "toggle", value: true },
      { key: "points", label: "Points", type: "toggle", value: true },
      { heading: "Donut" },
      { key: "value", label: "Value", type: "number", value: 500, min: 0, max: 720 },
      { key: "color", label: "Colour", type: "select", value: 4, options: [1, 2, 3, 4, 5] },
    ],
    render: (p) => {
      const S = [
        { name: "Direct", values: [38, 52, 32, 12, 35, 28, 33, 25] },
        { name: "Referral", color: 3, values: [11, 9, 15, 12, 18, 14, 9, 16] },
        { name: "Organic", color: 5, values: [7, 13, 9, 16, 11, 19, 14, 10] },
      ].slice(0, p.series);
      const chart = p.chart === "Line" ? <LineChart key={String(p.animate)} animate={p.animate} fill={p.fill} series={S} area={p.area} points={p.points} />
        : p.chart === "Donut" ? <DonutChart key={String(p.animate)} animate={p.animate} value={p.value} max={720} color={p.color} />

      return p.fill && p.chart !== "Donut" ? <div className="h-80 w-full"><Panel title="Filled panel" caption="The chart takes the body's height">{chart}</Panel></div> : chart;

  dashboard: {

      { key: "widget", label: "Widget", type: "select", value: "Gauge", options: ["Gauge", "BarList", "CountUp", "Sparkline"] },
      { heading: "Gauge" },
      { key: "percent", label: "Percent", type: "number", value: 64, min: 0, max: 100 },
      { key: "ticks", label: "Ticks", type: "select", value: 36, options: [24, 36, 48] },
      { heading: "BarList" },
      { key: "bars", label: "Bars", type: "select", value: 4, options: [2, 3, 4, 5] },
      { key: "stagger", label: "Stagger", type: "select", value: 90, options: [0, 90, 180] },
      { heading: "CountUp" },
      { key: "value", label: "Value", type: "number", value: 1437500, min: 0, max: 9999999 },
      { heading: "Sparkline" },

      { key: "area", label: "Area", type: "toggle", value: true },
      { key: "color", label: "Colour", type: "select", value: 1, options: [1, 2, 3, 4, 5] },
    ],
    render: (p) => {
      const ITEMS = [
        { label: "Brand Identity", value: 48 }, { label: "Website", value: 31 }, { label: "Company Profile", value: 24 },
        { label: "Graphic Design", value: 17 }, { label: "Motion", value: 9 },
      ].slice(0, p.bars);
      if (p.widget === "BarList") return <BarList key={`${p.bars}-${p.stagger}`} items={ITEMS} stagger={p.stagger} />;
      if (p.widget === "CountUp") return <p className="text-display-lg font-semibold text-ink"><CountUp value={p.value} format={(n) => `ETB ${n.toLocaleString()}`} /></p>;
      if (p.widget === "Sparkline") return <div className="w-full max-w-80"><Sparkline key={`${p.smooth}-${p.area}-${p.color}`} smooth={p.smooth} area={p.area} color={p.color} animate values={[6, 9, 7, 12, 10, 15, 13, 19, 16, 22]} /></div>;
      return <Gauge key={`${p.percent}-${p.ticks}`} percent={p.percent} ticks={p.ticks} />;
    },
  },
  privacy: {
    schema: [
      { key: "defaultShown", label: "Shown by default", type: "toggle", value: false },
      { key: "placeholder", label: "Placeholder", type: "text", value: "•••••" },
    ],
    render: (p) => (
      <PrivacyScope key={String(p.defaultShown)} defaultShown={p.defaultShown}>
        <div className="flex w-full max-w-80 items-center justify-between gap-3">
          <p className="text-caption font-medium text-ink">Balance</p>
          <PrivacyToggle />
        </div>
        <p className="mt-2 text-display font-semibold text-ink tabular-nums"><Masked placeholder={p.placeholder}>$42,180</Masked></p>
      </PrivacyScope>
    ),
  },
  checkbox: {
    schema: [
      { key: "label", label: "Label", type: "text", value: "Morning run" },
      { key: "description", label: "Description", type: "text", value: "5 km" },
      { key: "checked", label: "Checked", type: "toggle", value: true },
      { key: "mixed", label: "Mixed", type: "toggle", value: false },
      { key: "disabled", label: "Disabled", type: "toggle", value: false },
    ],
    render: (p, set) => <Checkbox checked={p.checked} mixed={p.mixed} disabled={p.disabled} label={p.label} description={p.description || undefined} onChange={(v) => set("checked", v)} />,
  },
  filterbar: {
    schema: [
      { key: "count", label: "Filters", type: "select", value: 4, options: [2, 3, 4, 5, 6] },
      { key: "search", label: "Search", type: "toggle", value: true },
      { key: "active", label: "Applied", type: "select", value: 1, options: [0, 1, 2, 3] },
      { key: "leading", label: "Label", type: "toggle", value: true },
      { key: "trailing", label: "Compare toggle", type: "toggle", value: true },
    ],
    render: (p) => (
      <FilterBar leading={p.leading ? "Filters" : undefined} trailing={p.trailing ? <span className="flex items-center gap-2 text-caption text-ink-2">Compare<Switch on onToggle={() => {}} label="Compare" size="sm" /></span> : undefined} active={p.active} onClear={() => {}} search={p.search ? <Input size="sm" leadingIcon="search" placeholder="Search…" width="w-48" /> : undefined}>
        {Array.from({ length: p.count }, (_, i) => <Select key={i} size="sm" placeholder={["All categories", "All statuses", "This month", "Any owner", "Any region", "Any channel"][i]} width="w-40" />)}
      </FilterBar>
    ),
  },
  brandicon: {
    schema: [
      { key: "name", label: "Brand", type: "select", value: "github", options: ["github", "google", "apple", "slack", "notion", "figma", "linkedin", "x", "instagram", "youtube", "stripe", "openai"] },
      { key: "size", label: "Size", type: "select", value: 20, options: [14, 16, 20, 24, 32] },
      { key: "tone", label: "Render", type: "select", value: "text-ink", options: ["text-ink", "text-ink-2", "text-accent", "brand colour", "real logo"] },
    ],
    render: (p) => p.tone === "real logo" ? <BrandLogo name={p.name} size={p.size} /> : <BrandIcon name={p.name} size={p.size} color={p.tone === "brand colour" ? "brand" : "mono"} className={p.tone.startsWith("text-") ? p.tone : ""} />,
  },
  colorpicker: {
    schema: [
      { key: "value", label: "Value", type: "text", value: "#A5E12A" },
      { key: "swatches", label: "Swatches", type: "toggle", value: true },
    ],
    render: (p, set) => <ColorPicker value={/^#[0-9a-f]{6}$/i.test(p.value) ? p.value : "#a5e12a"} onChange={(hex) => set("value", hex.toUpperCase())} swatches={p.swatches ? undefined : []} />,
  },
  approvalflow: {
    schema: [
      { key: "questions", label: "Questions", type: "select", value: 3, options: [1, 2, 3] },
      { key: "send", label: "Send label", type: "text", value: "Send" },
      { key: "skip", label: "Skip label", type: "text", value: "Skip" },
      { key: "resettable", label: "Start over", type: "toggle", value: true },
    ],
    render: (p) => <ApprovalFlow key={p.questions} questions={QUESTIONS.slice(0, p.questions)} labels={{ send: p.send, skip: p.skip }} resettable={p.resettable} />,
  },
};

/* ═══════════ The docs shell ═══════════ */
const RADII = ["default", "sharp", "rounded", "full"];
const SIZES = ["default", "comfortable", "spacious"];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* The rail's accent swatch opens the real ColorPicker in an anchored layer. */
function AccentControl({ accent, setAccent }) {
  const layerId = useId();
  const { open, position, anchorRef, openAt, close } = useAnchoredLayer(layerId);
  const current = accent || (typeof window !== "undefined" ? getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()   : "#a5e12a");
  return (
    <div className="flex items-center gap-1.5">
      {accent && (
        <IconButton label="Reset custom accent" onClick={() => setAccent("")} className="text-ink-3 hover:bg-hover hover:text-ink">
          <Icon name="close" size={12} strokeWidth={2.2} />
        </IconButton>
      )}
      <button
        ref={anchorRef}
        type="button"
        aria-haspopup="dialog"
        aria-expanded={open}
        onClick={() => (open ? close() : openAt({ estimatedHeight: 320, width: 296, align: "end" }))}
        className="corner-smooth flex h-7 items-center gap-2 rounded-control px-2 text-caption font-medium text-ink transition-colors duration-150 hover:bg-hover"
      >
        <span aria-hidden className="size-3.5 rounded-full" style={{ background: current, boxShadow: "var(--shadow-overlay)" }} />
        {accent ? accent.toUpperCase() : "Palette"}
      </button>
      {open && position && (
        <Popover id={layerId} role="dialog" x={position.x} top={position.top} bottom={position.bottom} width={296} onClose={close} className="p-3">
          <ColorPicker value={/^#[0-9a-f]{6}$/i.test(current) ? current : "#a5e12a"} onChange={setAccent} />
        </Popover>
      )}
    </div>
  );
}

function MakeThemYours({ theme, setTheme, palette, setPalette, accent, setAccent, radius, setRadius, size, setSize }) {
  return (
    <div className="flex flex-col gap-1">
      <ControlRow label="Theme">
        <RailSelect ariaLabel="Theme" value={cap(theme)} options={["Light", "Dark"]} onChange={(v) => setTheme(v.toLowerCase())} />
      </ControlRow>
      <ControlRow label="Palette">
        <RailSelect ariaLabel="Palette" value={cap(palette)} options={PALETTES.map((p) => p.label)} onChange={(v) => setPalette(PALETTES.find((p) => p.label === v).id)} />
      </ControlRow>
      <ControlRow label="Accent">
        <AccentControl accent={accent} setAccent={setAccent} />
      </ControlRow>
      <ControlRow label="Radius">
        <RailSelect ariaLabel="Radius" value={cap(radius)} options={RADII.map(cap)} onChange={(v) => setRadius(v.toLowerCase())} />
      </ControlRow>
      <ControlRow label="Size">
        <RailSelect ariaLabel="Size" value={cap(size)} options={SIZES.map(cap)} onChange={(v) => setSize(v.toLowerCase())} />
      </ControlRow>
    </div>
  );
}

function RailPanel({ title, action, children }) {
  return (
    <section className="rounded-card bg-surface p-4 shadow-card">
      <div className="mb-3 flex items-center justify-between gap-2">
        <h2 className="text-body font-semibold text-ink">{title}</h2>
        {action}
      </div>
      {children}
    </section>
  );
}

function Section({ id, title, note, children }) {
  return (
    <section id={id} className="mb-2 w-full">
      <h2 className="text-title font-semibold text-ink">{title}</h2>
      {note && <p className="mt-0.5 max-w-xl text-caption text-ink-3">{note}</p>}
      <div className="mt-4 flex flex-wrap gap-6">{children}</div>
    </section>
  );
}
/* Not Card: Card is overflow-hidden, and demo surfaces need floating UI
   (toolbars, popovers, tooltips) to escape the box rather than be clipped. */
function GalleryCard({ label, wide, full, children }) {
  return (
    <div className={`rounded-card bg-surface p-5 shadow-card ${full ? "w-full" : wide ? "w-full max-w-105" : ""}`}>
      <p className="mb-3 font-mono text-micro tracking-wide text-ink-3 uppercase">{label}</p>
      {children}
    </div>
  );
}

function DocsPage({ page, index, pg, state, set }) {
  const prev = PAGES[index - 1], next = PAGES[index + 1];
  const RAW = "https://raw.githubusercontent.com/eyosiyasketema1/formic-design-system/main";
  const files = page.file.split(" ");
  const install = files.map((f) => `curl --create-dirs -o src/${f} ${RAW}/${f}`).join(" && ");
  const [copied, setCopied] = useState(false);
  const copy = () => { try { navigator.clipboard.writeText(install); setCopied(true); setTimeout(() => setCopied(false), 1400); } catch {} };
  const PageBody = page.Component;
  return (
    <div className="flex min-w-0 gap-8">
      <div className="min-w-0 flex-1">
        <header className="mb-8 flex items-start justify-between gap-4">
          <div className="min-w-0">
            <h1 id="page-title" tabIndex={-1} className="text-display font-semibold tracking-tight text-ink outline-none">{page.title}</h1>
            {page.note && <p className="mt-1.5 max-w-2xl text-body text-ink-2">{page.note}</p>}
          </div>
          <div className="flex shrink-0 items-center gap-1">
            <IconButton label={prev ? `Previous: ${prev.title}` : "Previous"} onClick={() => prev && (location.hash = `#/${prev.id}`)} disabled={!prev} className="text-ink-3 hover:bg-hover hover:text-ink disabled:opacity-35">
              <Icon name="chevron-left" size={16} strokeWidth={2} />
            </IconButton>
            <IconButton label={next ? `Next: ${next.title}` : "Next"} onClick={() => next && (location.hash = `#/${next.id}`)} disabled={!next} className="text-ink-3 hover:bg-hover hover:text-ink disabled:opacity-35">
              <Icon name="chevron-right" size={16} strokeWidth={2} />
            </IconButton>
          </div>
        </header>

        <section className="mb-8">
          <h2 className="text-title font-semibold text-ink">Installation</h2>
          <div className="mt-3 flex items-center gap-2 rounded-control bg-field px-3 py-2">
            <code className="min-w-0 flex-1 truncate font-mono text-small text-ink">{install}</code>
            <IconButton label={copied ? "Copied" : "Copy install command"} onClick={copy} className="text-ink-3 hover:bg-hover hover:text-ink">
              <Icon name={copied ? "check" : "copy"} size={14} strokeWidth={2} />
            </IconButton>
          </div>
          <p className="mt-2 text-caption text-ink-3">Formic is vendored: copy the file in and own it. Tokens come from <code className="font-mono">styles/tokens.css</code>.</p>
        </section>

        {pg && (
          <section className="mb-8">
            <h2 className="text-title font-semibold text-ink">Playground</h2>
            <div className="mt-3 flex min-h-56 items-center justify-center rounded-card bg-surface p-8 shadow-card">
              {pg.render(state, set)}
            </div>
          </section>
        )}

        {/* the flex-wrap row the old <Section> used to provide: cards size to
            their content and sit with a gap, instead of stacking full-width */}
        <div className="flex flex-wrap gap-6">
          <PageBody />
        </div>
      </div>
    </div>
  );
}

function RailPanels({ page, pg, knobs, pgState, pgSet, pgReset }) {
  return (
    <>
      <RailPanel title="Make them yours"><MakeThemYours {...knobs} /></RailPanel>
      {pg && (
        <RailPanel title="Playground" action={
          <button type="button" onClick={pgReset} className="text-small font-medium text-ink-3 transition-colors duration-150 hover:text-ink">Reset</button>
        }>
          <p className="mb-2 text-caption font-semibold text-ink">{page.title}</p>
          <PlaygroundControls schema={pg.schema} state={pgState} set={pgSet} />
        </RailPanel>
      )}
    </>
  );
}

function App() {
  const [theme, setTheme] = useTheme();
  const [palette, setPalette] = usePalette();
  const [accent, setAccentState] = useAccent();
  const [radius, setRadius] = useRadius();
  const [size, setSize] = useSize();
  const route = useRoute();
  const index = PAGE_INDEX[route] ?? 0;
  const page = PAGES[index];
  const pg = PLAYGROUNDS[page.id];
  const [pgState, pgSet, pgReset] = usePlayground(pg ? pg.schema : [], page.id);
  const groups = [];
  for (const p of PAGES) {
    let g = groups.find((x) => x.label === p.group);
    if (!g) groups.push((g = { label: p.group, items: [] }));
    g.items.push(p);
  }
  const knobs = { theme, setTheme, palette, setPalette, accent, setAccent: setAccentState, radius, setRadius, size, setSize };
  return (
    <div className="flex min-h-screen">
      {/* left rail */}
      <aside className="sticky top-0 hidden h-screen w-60 shrink-0 flex-col overflow-y-auto border-r border-line bg-sidebar px-3 py-6 lg:flex">
        <div className="mb-5 px-2">
          <BackToSite className="-ml-2 mb-2" />
          <p className="text-title font-semibold tracking-tight text-ink">Formic AI Design System</p>
          <p className="mt-0.5 font-mono text-micro text-ink-3">v0.1 · {PAGES.filter((p) => p.group !== "Foundations").length} components</p>
        </div>
        <nav className="flex flex-col" aria-label="Components">
          {groups.map((g) => (
            <div key={g.label} className="mb-4">
              <p className="mb-1 flex items-baseline gap-1.5 px-2 font-mono text-micro tracking-wide text-ink-3 uppercase">
                {g.label} <span>{g.items.length}</span>
              </p>
              <div className="flex flex-col gap-px">
                {g.items.map((p) => (
                  <a key={p.id} href={`#/${p.id}`} aria-current={route === p.id ? "page" : undefined}
                    className={`corner-smooth rounded-control px-2 py-1 text-caption transition-colors duration-150 hover:bg-hover ${route === p.id ? "bg-hover-2 font-medium text-ink" : "text-ink-2"}`}>
                    {p.title}
                  </a>
                ))}
              </div>
            </div>
          ))}
        </nav>
      </aside>

      {/* centre */}
      <main className="min-w-0 flex-1 px-6 py-8 lg:px-10">
        <div className="mx-auto max-w-5xl">
          <div className="mb-6 lg:hidden">
            <BackToSite className="-ml-2 mb-2" />
            <div className="rounded-control bg-surface shadow-btn">
              <RailSelect ariaLabel="Go to component" value={page.title} options={PAGES.map((p) => p.title)} onChange={(t) => { const p = PAGES.find((x) => x.title === t); if (p) location.hash = `#/${p.id}`; }} />
            </div>
          </div>
          <div className="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:hidden">
            <RailPanels page={page} pg={pg} knobs={knobs} pgState={pgState} pgSet={pgSet} pgReset={pgReset} />
          </div>
          <DocsPage key={page.id} page={page} index={index} pg={pg} state={pgState} set={pgSet} />
        </div>
      </main>

      {/* right rail — below xl the same panels render inside the page instead */}
      <aside className="sticky top-0 hidden h-screen w-64 shrink-0 flex-col gap-4 overflow-y-auto px-4 py-6 xl:flex">
        <RailPanels page={page} pg={pg} knobs={knobs} pgState={pgState} pgSet={pgSet} pgReset={pgReset} />
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
</html>
