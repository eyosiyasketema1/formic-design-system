<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useLayoutEffect } = React;

/* ═══════════ Primitives ═══════════ */
const ICON_PATHS = {
  chevron: <path d="M6 9l6 6 6-6" />,
  check: <path d="M20 6L9 17l-5-5" />,
  close: <path d="M18 6L6 18M6 6l12 12" />,
  retry: <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />,
  "arrow-up": <path d="M12 19V5M5 12l7-7 7 7" />,
  plus: <path d="M12 5v14M5 12h14" />,
  clock: (<><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></>),
  ellipsis: (

    </g>
  ),
  mic: (<><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" /></>),
  file: (<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></>),
  clip: <path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />,
  chart: <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />,
  layers: (<><path d="M12 2 2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5M2 12l10 5 10-5" /></>),
  globe: (<><circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></>),

function Icon({ name, size = 14, strokeWidth = 2.2, className, style }) {

    <svg aria-hidden width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"

}

    <span className={`bg-clip-text text-body font-medium text-transparent ${className}`}
      style={{ backgroundImage: "linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%)",

const CHIP_TONES = {
  field: "bg-field text-ink-2 shadow-hairline",
  surface: "bg-surface text-ink shadow-btn",
  inset: "bg-inset text-ink-2 shadow-hairline",
};
const CHIP_SIZES = {
  xs: "h-4.5 gap-1 rounded-[5px] px-[3px] text-micro",
  sm: "h-5.5 rounded-chip px-1.5 text-tiny",
  md: "h-7 gap-1.5 rounded-chip px-2 text-tiny",

  return (
    <As className={`inline-flex items-center transition-colors duration-150 ${CHIP_SIZES[size]} ${CHIP_TONES[tone]} ${mono ? "font-mono" : ""} ${className}`} {...rest}>

function DiffStat({ add, del = 0, className = "" }) {
  return (
    <span className={`shrink-0 font-mono text-tiny tabular-nums ${className}`}>

function IconButton({ label, onClick, className = "", children, ...rest }) {
  return (
    <button type="button" aria-label={label} onClick={onClick}
      className={`flex size-6 shrink-0 items-center justify-center rounded-sm transition-colors duration-150 ${className}`} {...rest}>
      {children}
    </button>
  );
}
function Disclosure({ open, duration = 300, live = false, className = "", innerClassName = "min-h-0 overflow-hidden", children }) {
  return (
    <div className={`grid transition-[grid-template-rows,opacity] ${className}`}
      style={{ gridTemplateRows: open ? "1fr" : "0fr", opacity: open ? 1 : 0,
        transitionDuration: `${duration}ms`, transitionTimingFunction: "var(--ease-out-quint)" }}>
      <div className={innerClassName} aria-live={live ? "polite" : undefined} {...(open ? {} : { inert: "" })}>{children}</div>

const entrance = (name, index, { duration = 300, stagger = 80, delay = 0 } = {}) => ({
  animation: `${name} ${duration}ms var(--ease-out-quint) ${delay + index * stagger}ms both`,

const popIn = (index = 0, opts) => entrance("pop-in", index, opts);
function Card({ className = "", children, ...rest }) {
  return <div className={`overflow-hidden rounded-card bg-surface shadow-card ${className}`} {...rest}>{children}</div>;
}
const BADGE_TONES = { green: "bg-green-tint text-green", red: "bg-red-tint text-red", neutral: "bg-inset text-ink-2" };

  return (
    <span className={`inline-flex items-center gap-1.5 rounded-full font-medium ${free ? "" : "h-5.5 px-2 text-tiny"} ${BADGE_TONES[tone]} ${className}`} style={style}>

}
function RadioCheck({ type, on }) {
  return (
    <span className={`flex size-4 shrink-0 items-center justify-center transition-colors duration-200 ${type === "radio" ? "rounded-full" : "rounded-[5px]"} ${on ? "bg-ink text-canvas" : "shadow-[inset_0_0_0_1.5px_var(--line-strong)] text-transparent"}`}>
      {type === "radio" ? (
        <span className="size-1.5 rounded-full bg-canvas transition-transform duration-200" style={{ transform: on ? "scale(1)" : "scale(0)" }} />

}
function AvatarStack({ srcs, className = "" }) {
  return (
    <span className={`flex -space-x-1 ${className}`}>
      {srcs.map((src, i) => (
        <img key={i} src={src} alt="" className="source-avatar size-3.5 rounded-full bg-surface shadow-[0_0_0_1.5px_var(--canvas)]" />

    if (!onClose) return;

    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return ReactDOM.createPortal(
    <div id={id} role={role} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}
      className={`fixed z-50 overflow-hidden rounded-md bg-surface shadow-overlay ${className}`}
      style={{ left: x, top, bottom, animation: "pop-in 160ms var(--ease-out-quint) both", transformOrigin: top === undefined ? "bottom left" : "top left" }}>
      {children}

function SendButton({ enabled = true, label = "Send", round = false, className = "", onClick }) {
  return (
    <button type="button" aria-label={label} disabled={!enabled} onClick={onClick}
      className={`flex size-7 shrink-0 items-center justify-center ${round ? "rounded-full" : "rounded-control"} transition-[background-color,color,transform] duration-200 enabled:active:scale-[0.96] ${className}`}
      style={{
        background: enabled ? "var(--ink)" : "var(--field)",
        color: enabled ? "var(--surface)" : "var(--ink-3)",
        boxShadow: enabled ? "var(--highlight-raised)" : "var(--shadow-btn)",
      }}>
      <Icon name="arrow-up" strokeWidth={2.5} />
    </button>
  );
}
function useSequence(steps) {
  const [stage, setStage] = useState(0);
  useEffect(() => {
    if (stage >= steps.length - 1) return;
    const t = setTimeout(() => setStage((s) => s + 1), steps[stage]);
    return () => clearTimeout(t);
  }, [stage, steps]);
  return stage;
}
function useElapsed() {
  const [ds, setDs] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setDs((d) => d + 1), 100);
    return () => clearInterval(t);
  }, []);
  const total = ds / 10;
  if (total < 60) return `${total.toFixed(1)}s`;
  return `${Math.floor(total / 60)}m ${(total % 60).toFixed(1)}s`;
}

/* ═══════════ LoadingState ═══════════ */
const chevron = Array.from({ length: 9 }, (_, i) => {
  const r = Math.floor(i / 3), c = i % 3;
  return (c + Math.abs(r - 1)) * 90;

const orbit = Array.from({ length: 9 }, (_, i) => {
  const k = ORBIT_ORDER.indexOf(i);
  return k === -1 ? null : k * 110;
});
const PATTERNS = {
  Drive: { delays: chevron, dur: 650, round: false },
  Dots: { delays: chevron, dur: 650, round: true },
  Orbit: { delays: orbit, dur: 950, round: false },
};
function LoaderGrid({ delays, dur, round }) {
  return (

const QUESTIONS = [

  { q: "Which mix-ins should we stock?", type: "check", options: ["Chocolate chips", "Waffle bits", "Sprinkles"] },
  { q: "Which market do we enter first?", type: "radio", options: ["Food trucks", "Grocery freezers", "Scoop shops"] },
];
function ApprovalCard({ resettable = true }) {
  const [qi, setQi] = useState(0);
  const [answers, setAnswers] = useState({});

  const [open, setOpen] = useState(true);
  const question = QUESTIONS[qi];
  const last = qi === QUESTIONS.length - 1;
  const selected = answers[qi] ?? [];
  const hasAnswer = selected.length > 0 || Boolean((custom[qi] || "").trim());
  const toggle = (index) => {
    setAnswers((current) => {
      const picked = current[qi] ?? [];
      const next = question.type === "radio" ? [index]
        : picked.includes(index) ? picked.filter((item) => item !== index) : [...picked, index];
      return { ...current, [qi]: next };
    });
    if (question.type === "radio") {
      setCustom((current) => ({ ...current, [qi]: "" }));
      window.setTimeout(() => {
        if (qi === QUESTIONS.length - 1) setSent(true);

    }

    return (
      <button type="button" onClick={() => setOpen(true)} className="rounded-control bg-surface px-3 py-2 text-caption font-medium text-ink shadow-btn transition-colors duration-150 hover:bg-hover">

            <IconButton label="Dismiss" onClick={() => setOpen(false)} className="text-ink-3 hover:bg-hover hover:text-ink">
              <Icon name="close" />
            </IconButton>
          </div>
          <div className="mt-2 flex flex-col gap-0.5">
            {question.options.map((option, i) => {
              const on = selected.includes(i);
              return (
                <button key={option} type="button" aria-pressed={on} onClick={() => toggle(i)}
                  className="-mx-1.5 flex items-center gap-2 rounded-control px-1.5 py-1 text-left transition-colors duration-150 hover:bg-hover">
                  <RadioCheck type={question.type} on={on} />
                  <span className={`text-body transition-colors duration-200 ${on ? "text-ink" : "text-ink-2"}`}>{option}</span>
                </button>
              );
            })}
            <label className="-mx-1.5 flex items-center gap-2 rounded-control px-1.5 py-1 transition-colors duration-150 focus-within:bg-hover hover:bg-hover">
              <span aria-hidden="true" className="size-4 shrink-0" />
              <input value={custom[qi] ?? ""}
                onChange={(event) => {
                  setCustom((current) => ({ ...current, [qi]: event.target.value }));
                  if (question.type === "radio") setAnswers((current) => ({ ...current, [qi]: [] }));
                }}
                placeholder="Type something…" aria-label="Custom answer"
                className="min-w-0 flex-1 bg-transparent text-body text-ink outline-none placeholder:text-ink-3" />

              className="flex size-6 items-center justify-center rounded-[5px] text-ink-3 transition-colors duration-150 enabled:hover:bg-hover enabled:hover:text-ink-2 disabled:opacity-35">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <span className="flex items-center gap-1">
              {QUESTIONS.map((_, i) => (

                  aria-current={i === qi && !sent ? "step" : undefined} disabled={sent} onClick={() => setQi(i)}
                  className="rounded-full transition-[width,height,background-color,border-color,border-width] duration-300 disabled:cursor-default"
                  style={
                    i === qi && !sent ? { width: 9, height: 9, border: "2.5px solid var(--ink)" }
                    : sent || i < qi ? { width: 7, height: 7, background: "var(--ink-3)" }

                  } />
              ))}
            </span>
            <button type="button" aria-label="Next" disabled={last || sent}
              onClick={() => setQi((current) => Math.min(QUESTIONS.length - 1, current + 1))}

            </button>
          </span>
          {!sent && (
            <SendButton className="-mr-0.5" enabled={hasAnswer} label={last ? "Send answers" : "Next question"}
              onClick={() => { if (last) setSent(true); else setQi((current) => current + 1); }} />
          )}
        </div>
      </Card>
    </div>
  );
}

function ChatComposer({ tabs = CC_TABS, placeholder = "Prompt or tag a flavor with @", initialMessage = "Compare mint chip to last summer", replies = CC_REPLIES, onSend }) {
  const [phase, setPhase] = useState(initialMessage ? "done" : "idle");

  const sent = phase !== "idle";
  const canSend = draft.trim().length > 0;

          <div className="flex items-center justify-end">

        {rcCodeChip("7_days", "accent")}.
      </>,
    short: "Reorder from cone_king \xB7 7-day lead",
    signal: 3,
    tone: "var(--green)",
    label: "High confidence",
    cta: "Accept",
    ctaVariant: "accent"
  },
  {
    key: "review",
    body: <>
        Switch vanilla to {rcCodeChip("vanilla_madagascar", "orange")} for peak season.
      </>,
    short: "Switch to vanilla_madagascar",
    signal: 2,
    tone: "var(--orange)",
    label: "Needs review",
    cta: "Configure",
    ctaVariant: "primary"
  },
  {
    key: "none",
    body: <>
        Fall back to a <span className="font-medium text-ink">full restock</span> across every SKU.
      </>,
    short: "Full restock across every SKU",
    signal: 0,
    tone: "var(--ink-3)",
    label: "No signal",
    cta: "Accept full restock",
    ctaVariant: "primary"
  }
];
function RcMeter({ signal, tone }) {
  return <span aria-hidden className="flex items-end gap-0.5">
      {[0, 1, 2].map((bar) => <span
    key={bar}
    className="w-1 rounded-full transition-colors duration-300"
    style={{ height: 10, background: bar < signal ? tone : "var(--line-strong)" }}
  />)}
    </span>;
}
function RecommendationCard({
  title = "Want me to place this restock order?",
  options = RC_OPTIONS,
  onAccept
} = {}) {
  const [selected, setSelected] = useState(0);
  const [open, setOpen] = useState(false);
  const [accepted, setAccepted] = useState(false);
  const active = options[selected];
  const others = options.map((o, i) => ({ o, i })).filter(({ i }) => i !== selected);
  return <Card className="w-full max-w-95">
      <div className="primitive-card-pad">
        <span className="text-body font-semibold text-ink">{title}</span>
        <p
    key={active.key}
    className="mt-1.5 min-h-12 text-body leading-relaxed text-ink-2"
    style={{ animation: "fade-in 180ms ease-out both" }}
  >
          {active.body}
        </p>
      </div>
      {
    /* alternatives drawer — a distinctly new section of the card */
  }
      <Disclosure open={open}>
          <div className="border-t border-line bg-inset px-2 py-2">
            <p className="px-1.5 pb-1 text-tiny font-medium text-ink-3">
              Other options
            </p>
            {others.map(({ o, i }) => <button
    key={o.key}
    type="button"
    onClick={() => {
      setSelected(i);
      setAccepted(false);
    }}
    className="flex w-full items-center gap-2.5 rounded-control px-1.5 py-1.5
                  text-left transition-colors duration-150 hover:bg-hover"
  >
                <RcMeter signal={o.signal} tone={o.tone} />
                <span className="min-w-0 flex-1 truncate text-caption text-ink">{o.short}</span>
                <span className="shrink-0 text-tiny text-ink-3">{o.label}</span>
              </button>)}
          </div>
      </Disclosure>
      <div className="primitive-card-footer flex items-center justify-between gap-3 bg-inset">
        <span className="flex items-center gap-2">
          <RcMeter signal={active.signal} tone={active.tone} />
          <span className="text-caption font-medium text-ink-2">{active.label}</span>
        </span>
        <span className="-mr-0.5 flex items-center gap-2">
          <Button
    variant="secondary"
    size="sm"
    aria-expanded={open}
    onClick={() => setOpen((current) => !current)}
  >
            Alternatives
          </Button>
          <Button
    variant={accepted ? "success" : active.ctaVariant}
    size="sm"
    onClick={() => {
      if (accepted) return;
      setAccepted(true);
      onAccept?.(active);
    }}
  >
            {accepted ? "Accepted" : active.cta}
          </Button>
        </span>
      </div>
    </Card>;
}

/* ═══════════ ContextCards ═══════════ */
const CTX_TONES = {
  red: "bg-red",
  green: "bg-green",
  accent: "bg-accent",
  orange: "bg-orange"
};
const CTX_CHUNKS = [
  {
    title: "Vendor onboarding rule",
    chars: "290 characters",
    body: "Cold-chain certification must be verified before a new dairy can be added to the reorder workflow.",
    source: "Dairy Onboarding SOP.pdf",
    badge: "PDF",
    tone: "red",
    href: "#"
  },
  {

    chars: "1,250 characters",
    body: "Q4 velocity table: pistachio +18%, vanilla +6%, rocky road -11%; retire flavors below 40 scoops weekly.",
    source: "Sales Velocity Export.csv",
    badge: "CSV",
    tone: "green",
    href: "#"
  }
];
function ContextCards({
  title = "All chunks",
  count = 32,
  chunks = CTX_CHUNKS
} = {}) {
  const [chipsShown, setChipsShown] = useState(false);
  useEffect(() => {
    const chips = setTimeout(() => setChipsShown(true), 700);
    return () => clearTimeout(chips);
  }, []);
  return <div className="flex w-full max-w-95 flex-col gap-2">
      <div
    className="flex items-center gap-2 px-0.5"
    style={{ animation: "fade-in 400ms ease-out both" }}
  >
        <span className="text-body font-semibold text-ink">{title}</span>
        <Chip tone="inset" className="font-medium tabular-nums">
          {count}
        </Chip>
      </div>
      {chunks.map((chunk, i) => <Card key={chunk.title} style={fadeUp(i, { duration: 400, stagger: 100 })}>
          <div className="primitive-card-bar flex items-center gap-2.5 border-b border-line">
            <span className="flex min-w-0 items-center gap-1.5 text-body font-medium text-ink">
              <Icon name="lines" size={11} strokeWidth={2.5} className="shrink-0" />
              <span className="truncate">{chunk.title}</span>
            </span>
            <span className="ml-auto shrink-0 text-small text-ink-3 tabular-nums">{chunk.chars}</span>
          </div>
          <p className="px-3 pt-2 pb-1 text-caption leading-relaxed text-ink-2">
            {chunk.body}
          </p>
          <div className="px-3 pb-3">
            {(() => {
    const SourceEl = chunk.href ? "a" : "span";
    const delay = chipsShown ? "0ms" : `${i * 80}ms`;
    return <SourceEl
      {...chunk.href ? { href: chunk.href, target: "_blank", rel: "noreferrer" } : {}}
      className={`inline-flex h-6 items-center gap-1.5 rounded-full bg-inset px-2
                    text-small font-medium text-ink-2 shadow-btn ${chunk.href ? "hover:bg-hover" : ""}`}
      style={{
        opacity: chipsShown ? 1 : 0,
        transform: chipsShown ? "scale(1)" : "scale(0.95)",
        transition: `opacity 300ms var(--ease-out-quint) ${delay}, transform 300ms var(--ease-out-quint) ${delay}, background-color 150ms ease`
      }}
    >
                  <span
      className={`flex size-3.5 items-center justify-center rounded-[4px] ${CTX_TONES[chunk.tone]} text-nano font-bold text-canvas`}
    >
                    {chunk.badge}
                  </span>
                  {chunk.source}
                  {chunk.href && <Icon name="external" size={9} strokeWidth={2.5} />}
                </SourceEl>;
  })()}
          </div>
        </Card>)}
    </div>;
}

/* ═══════════ Gallery ═══════════ */

function GalleryCard({ label, wide, children }) {

      {children}
    </Card>
  );
}
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem("ds-theme");
    if (stored === "light" || stored === "dark") return stored;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  });
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("ds-theme", theme);
  }, [theme]);
  return [theme, setTheme];
}
const PALETTES = [
  { id: "paper", label: "Paper", swatch: "#8a8a8a" },
  { id: "sage", label: "Sage", swatch: "#40724f" },
  { id: "twilight", label: "Twilight", swatch: "#4353d9" },
  { id: "clay", label: "Clay", swatch: "#a44a22" },
  { id: "ocean", label: "Ocean", swatch: "#0e7490" },
];
function usePalette() {
  const [palette, setPalette] = useState(() => localStorage.getItem("ds-palette") || "paper");
  useEffect(() => {
    if (palette === "paper") delete document.documentElement.dataset.palette;
    else document.documentElement.dataset.palette = palette;
    localStorage.setItem("ds-palette", palette);
  }, [palette]);
  return [palette, setPalette];
}

          className="flex size-8 shrink-0 items-center justify-center rounded-control bg-surface text-ink-2 shadow-btn transition-colors duration-150 hover:bg-hover hover:text-ink"
        >
          {theme === "dark" ? (

              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />

      </header>

            <span className="flex items-center gap-1 text-ink-3">
              <Icon name="chevron" /><Icon name="check" /><Icon name="retry" /><Icon name="arrow-up" /><Icon name="plus" /><Icon name="clock" /><Icon name="ellipsis" /><Icon name="mic" /><Icon name="file" /><Icon name="clip" /><Icon name="chart" /><Icon name="layers" /><Icon name="globe" /><Icon name="lines" /><Icon name="external" />

            ↻ Replay all

          <div className="grid gap-6 md:grid-cols-2">

    </main>
  );
}
