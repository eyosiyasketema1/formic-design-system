<script>
  /* Apply the stored theme before first paint. useTheme sets this later from
     React, which is far too late — dark users would get a white flash. */
  try {
    var _t = localStorage.getItem("ds-theme");
    document.documentElement.dataset.theme = _t === "light" ? "light" : "dark";
    /* radius and size are applied here too, so a stored choice doesn't
       render one frame at default before React takes over */
    for (const [k, key] of [["radius", "ds-radius"], ["size", "ds-size"]]) {
      const v = localStorage.getItem(key);
      if (v && v !== "default") document.documentElement.dataset[k] = v;
    }
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>

/* ── Design tokens (mirrors styles/tokens.css) ── */
:root {

/* Elements focused by script for screen-reader position (page headings,
   the active step) carry tabindex="-1", so Tab can never reach them — a
   ring there is never a keyboard affordance, only noise on click. */
[tabindex="-1"]:focus-visible { outline: none; }
input:focus-visible, textarea:focus-visible { outline: none; }
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
/* ── Global radius scale ───────────────────────────────── */
/* One knob for the whole system's corner language. Explicit token
   overrides per level rather than a calc() multiplier, so every value
   stays a real number you can read — the same mechanism palettes use. */
:root[data-radius="sharp"] {
  --radius-sm: 0px; --radius-chip: 0px; --radius-control: 0px;
  --radius-md: 0px; --radius-card: 0px; --radius-capsule: 0px;
}
:root[data-radius="rounded"] {
  --radius-sm: 8px; --radius-chip: 10px; --radius-control: 12px;
  --radius-md: 14px; --radius-card: 18px; --radius-capsule: 26px;
}
:root[data-radius="full"] {
  --radius-sm: 10px; --radius-chip: 999px; --radius-control: 999px;
  --radius-md: 14px; --radius-card: 20px; --radius-capsule: 999px;
}

/* ── Global size (density) scale ───────────────────────── */
/* Tailwind v4 derives every spacing and sizing utility from --spacing
   (0.25rem at root), so overriding that one value rescales all control
   heights, padding and gaps together — which is why rule 11 still holds
   at any density: a md button and a md input scale by the same factor.

   Type is deliberately NOT scaled: the ramp is fixed px by rule 2, so
   density changes without text becoming unreadable.

   The scale only goes UP on purpose. The xs control is exactly 24px,
   which is rule 15's touch-target floor, so any "compact" level would
   put the whole system in violation of its own rule. */
:root[data-size="comfortable"] { --spacing: 0.28rem; }
:root[data-size="spacious"] { --spacing: 0.3125rem; }

body { background: var(--canvas); color: var(--ink); font-family: "Urbanist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background-color 250ms ease, color 250ms ease; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* ─────────────────────────────────────────────────────────
 * RECORDS TABLE — component stylesheet
 * Import after tokens.css when using components/RecordsTable.
 * Everything reads tokens; light/dark/palettes come free.
 * ───────────────────────────────────────────────────────── */

.records-shell { position: relative; width: 100%; }
.records-shell.is-fill { height: 100%; }

.records-scroll {
  max-height: 480px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}
.records-shell.is-fill .records-scroll { max-height: none; height: 100%; }

.records-table {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  font-size: var(--text-caption);
}

/* ── headers ───────────────────────────────────────────── */
.records-header-cell {
  position: sticky;
  top: 0;
  z-index: 5;
  height: 36px;
  padding: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  text-align: left;
  font-weight: 500;
  font-size: var(--text-small);
  color: var(--ink-3);
  white-space: nowrap;
  user-select: none;
}
.records-header-cell:last-child { border-right: none; }
.records-header-cell.is-colsel { background: var(--inset); }

.records-header-button {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 35px;
  min-width: 0;
  padding: 0 10px;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 150ms, color 150ms;
}
.records-header-button:hover { background: var(--hover); color: var(--ink); }
.records-header-icon { display: flex; color: var(--ink-3); flex-shrink: 0; }

.records-sort {
  position: absolute;
  right: 26px;
  top: 50%;
  translate: 0 -50%;
  display: flex;
  padding: 3px;
  border-radius: 4px;
  color: var(--ink-3);
  cursor: pointer;
  opacity: 0;
  transition: opacity 150ms, transform 220ms var(--ease-out-quint), background-color 150ms;
}
.records-header-cell:hover .records-sort,
.records-sort:focus-visible { opacity: 0.6; }
.records-sort:hover { background: var(--hover); }
.records-sort.is-visible { opacity: 1 !important; color: var(--ink-2); }

.records-resize-handle {
  position: absolute;
  top: 0;
  right: -4px;
  width: 8px;
  height: 100%;
  cursor: col-resize;
  z-index: 6;
}
.records-resize-handle::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 0;
  width: 2px;
  height: 100%;
  background: transparent;
  transition: background-color 150ms;
}
.records-resize-handle:hover::after,
.records-resize-handle.is-resizing::after { background: var(--accent); }

/* ── cells ─────────────────────────────────────────────── */
.records-cell {
  height: 38px;
  padding: 0 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color 150ms;
}
.records-cell:last-child { border-right: none; }
.records-cell.is-colsel { background: var(--hover); }
.records-row:hover .records-cell { background: var(--hover); }
.records-row.is-selected .records-cell { background: var(--accent-tint); }

.records-sticky-cell { position: sticky; left: 0; z-index: 3; }
thead .records-sticky-cell { z-index: 7; }
tfoot .records-sticky-cell { z-index: 5; }

.records-company-header {

                  <span className="text-caption text-ink-2">{v.query}</span>
                </div>
              )}
              {v.rows.slice(0, visible).map((row, i) => {
                const content = (
                  <React.Fragment>
                    {variant === "Search" && <Dot tone={TONES[i % 3]} />}
                    {variant === "Steps" && (
                      i < visible - 1 || !working ? (
                        <Icon name="check" strokeWidth={2.5} className="shrink-0 text-ink-3" />
                      ) : (
                        <Spinner className="text-ink-2" />
                      )
                    )}
                    <span className={`min-w-0 truncate text-caption ${variant === "Reasoning" ? "whitespace-normal leading-relaxed text-ink-2" : "font-medium text-ink"} ${variant === "Search" ? "animated-underline" : ""}`}>
                      {row.primary}
                    </span>
                    {row.secondary && (
                      <span className={`shrink-0 text-tiny text-ink-3 ${row.mono ? "font-mono" : ""}`}>{row.secondary}</span>
                    )}
                    {row.add !== undefined && <DiffStat add={row.add} del={row.del} />}
                  </React.Fragment>
                );
                const rowClass = "flex min-h-7 w-full items-center gap-2 rounded-sm px-1.5 py-0.5 text-left";
                const animation = fadeUp(i, { duration: 320, stagger: 120 });
                if (variant === "Search") {
                  return (
                    <a key={row.primary} href={row.href} target="_blank" rel="noreferrer"
                      className={`${rowClass} transition-colors duration-150 hover:bg-hover`} style={animation}>
                      {content}
                    </a>
                  );
                }
                if (variant === "Coding") {
                  const selected = selectedTool === row.primary;
                  return (
                    <button key={row.primary} type="button" aria-pressed={selected}
                      onClick={() => setSelectedTool(selected ? null : row.primary)}
                      className={`${rowClass} transition-colors duration-150 ${selected ? "bg-inset" : "hover:bg-hover"}`} style={animation}>
                      {content}
                    </button>
                  );
                }
                return (
                  <div key={row.primary} className={rowClass} style={animation}>{content}</div>
                );
              })}
              {variant === "Search" && stage >= 3 && (
                <span className="text-small text-ink-3" style={{ animation: "fade-in 300ms ease-out both" }}>+7 more</span>
              )}
            </div>
          </div>
      </Disclosure>
    </div>
  );
}

/* ═══════════ ApprovalCard ═══════════ */
const QUESTIONS = [
  { q: "How many flavors should we launch?", type: "radio", options: ["Three (core line)", "Five (full case)", "Just one hero"] },
  { q: "Which mix-ins should we stock?", type: "check", options: ["Chocolate chips", "Waffle bits", "Sprinkles"] },
  { q: "Which market do we enter first?", type: "radio", options: ["Food trucks", "Grocery freezers", "Scoop shops"] },
];
function ApprovalCard({ resettable = true }) {
  const [qi, setQi] = useState(0);
  const [answers, setAnswers] = useState({});
  const [custom, setCustom] = useState({});
  const [sent, setSent] = useState(false);
  const [open, setOpen] = useState(true);
  const question = QUESTIONS[qi];
  const last = qi === QUESTIONS.length - 1;
  const selected = answers[qi] ?? [];
  const hasAnswer = selected.length > 0 || Boolean((custom[qi] || "").trim());
  const toggle = (index) => {
    setAnswers((current) => {
      const picked = current[qi] ?? [];
      const next = question.type === "radio" ? [index]
        : picked.includes(index) ? picked.filter((item) => item !== index) : [...picked, index];
      return { ...current, [qi]: next };
    });
    if (question.type === "radio") {
      setCustom((current) => ({ ...current, [qi]: "" }));
      window.setTimeout(() => {
        if (qi === QUESTIONS.length - 1) setSent(true);
        else setQi((current) => Math.min(QUESTIONS.length - 1, current + 1));
      }, 480);
    }
  };
  const reset = () => { setQi(0); setAnswers({}); setCustom({}); setSent(false); setOpen(true); };
  if (!open) {
    return (
      <button type="button" onClick={() => setOpen(true)} className="rounded-control bg-surface px-3 py-2 text-caption font-medium text-ink shadow-btn transition-colors duration-150 hover:bg-hover">
        Open approval
      </button>
    );
  }
  if (sent) {
    return (
      <div className="flex w-full max-w-80 items-center gap-3" style={{ animation: "pop-in 260ms var(--ease-out-quint) both" }}>
        <Badge tone="green" free className="py-1 pr-2.5 pl-1 text-caption">
          <span className="flex size-4.5 items-center justify-center rounded-full bg-green text-canvas">
            <Icon name="check" size={11} strokeWidth={3} />
          </span>
          Answers sent
        </Badge>
        {resettable && (
          <button type="button" onClick={reset} className="text-small font-medium text-ink-3 transition-colors duration-150 hover:text-ink">Start over</button>
        )}
      </div>
    );
  }
  return (
    <div className="flex min-h-[196px] w-full max-w-80 flex-col items-stretch">
      <Card className="w-full self-start">
        <div key={qi} className="primitive-card-pad" style={{ animation: "fade-up 350ms var(--ease-out-quint) both" }}>
          <div className="flex items-start justify-between gap-3">
            <span className="text-body font-medium text-ink">{question.q}</span>
            <IconButton label="Dismiss" onClick={() => setOpen(false)} className="text-ink-3 hover:bg-hover hover:text-ink">
              <Icon name="close" />
            </IconButton>
          </div>
          <div className="mt-2 flex flex-col gap-0.5">
            {question.options.map((option, i) => {
              const on = selected.includes(i);
              return (
                <button key={option} type="button" aria-pressed={on} onClick={() => toggle(i)}
                  className="-mx-1.5 flex items-center gap-2 rounded-control px-1.5 py-1 text-left transition-colors duration-150 hover:bg-hover">
                  <RadioCheck type={question.type} on={on} />
                  <span className={`text-body transition-colors duration-200 ${on ? "text-ink" : "text-ink-2"}`}>{option}</span>
                </button>
              );
            })}
            <label className="-mx-1.5 flex items-center gap-2 rounded-control px-1.5 py-1 transition-colors duration-150 focus-within:bg-hover hover:bg-hover">
              <span aria-hidden="true" className="size-4 shrink-0" />
              <input value={custom[qi] ?? ""}
                onChange={(event) => {
                  setCustom((current) => ({ ...current, [qi]: event.target.value }));
                  if (question.type === "radio") setAnswers((current) => ({ ...current, [qi]: [] }));
                }}
                placeholder="Type something…" aria-label="Custom answer"
                className="min-w-0 flex-1 bg-transparent text-body text-ink outline-none placeholder:text-ink-3" />
            </label>
          </div>
        </div>
        <div className="primitive-card-footer flex items-center justify-between">
          <span className="flex items-center gap-2">
            <button type="button" aria-label="Previous" disabled={qi === 0 || sent}
              onClick={() => setQi((current) => Math.max(0, current - 1))}
              className="flex size-6 items-center justify-center rounded-[5px] text-ink-3 transition-colors duration-150 enabled:hover:bg-hover enabled:hover:text-ink-2 disabled:opacity-35">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <span className="flex items-center gap-1">
              {QUESTIONS.map((_, i) => (
                <button key={i} type="button" aria-label={`Go to question ${i + 1}`}
                  aria-current={i === qi && !sent ? "step" : undefined} disabled={sent} onClick={() => setQi(i)}
                  className="rounded-full transition-[width,height,background-color,border-color,border-width] duration-300 disabled:cursor-default"
                  style={
                    i === qi && !sent ? { width: 9, height: 9, border: "2.5px solid var(--ink)" }
                    : sent || i < qi ? { width: 7, height: 7, background: "var(--ink-3)" }
                    : { width: 7, height: 7, border: "1.5px solid var(--ink-3)" }
                  } />
              ))}
            </span>
            <button type="button" aria-label="Next" disabled={last || sent}
              onClick={() => setQi((current) => Math.min(QUESTIONS.length - 1, current + 1))}
              className="flex size-6 items-center justify-center rounded-[5px] text-ink-3 transition-colors duration-150 enabled:hover:bg-hover enabled:hover:text-ink-2 disabled:opacity-35">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6" /></svg>
            </button>
          </span>
          {!sent && (
            <SendButton className="-mr-0.5" enabled={hasAnswer} label={last ? "Send answers" : "Next question"}
              onClick={() => { if (last) setSent(true); else setQi((current) => current + 1); }} />
          )}
        </div>
      </Card>
    </div>
  );
}

function Button({

  icon,

      style={style}

        {content}

    {...rest}
    type={type}
    disabled={disabled}
    aria-busy={loading || void 0}

    onClick={(event) => {
      if (loading) {

function ToolChips({ rows = TC_ROWS, diffs = TC_DIFFS, diffLines = TC_DIFF_LINES, summary = "4 tool calls, 2 messages", more = "+2 more" }) {
  const [step, setStep] = useState(0);
  const [open, setOpen] = useState(true);
  const [openRows, setOpenRows] = useState(new Set());
  const [preview, setPreview] = useState(null);
  const closeTimer = useRef(null);
  const cancelClose = () => {
    if (closeTimer.current !== null) { window.clearTimeout(closeTimer.current); closeTimer.current = null; }
  };
  const openPreview = (file) => (event) => {
    cancelClose();
    const rect = event.currentTarget.closest("[data-diffchip]").getBoundingClientRect();
    const previewHeight = 38 + (diffLines[file]?.length ?? 0) * 21;
    const fitsBelow = rect.bottom + 6 + previewHeight <= window.innerHeight - 12;
    setPreview({
      file,
      x: Math.max(12, Math.min(rect.left, window.innerWidth - 300)),
      ...(fitsBelow ? { top: rect.bottom + 6 } : { bottom: window.innerHeight - rect.top + 6 }),
    });
  };
  const closePreview = (file) => () => {
    cancelClose();
    closeTimer.current = window.setTimeout(() => {
      setPreview((current) => (current?.file === file ? null : current));
    }, 120);
  };
  useEffect(() => {
    setStep(0); setOpenRows(new Set()); setPreview(null);
  }, [rows]);
  const total = rows.length + 1;
  useEffect(() => {
    if (step >= total) return;
    const t = setTimeout(() => setStep((s) => s + 1), TC_STEP_MS);
    return () => clearTimeout(t);
  }, [step, total]);
  const toggleRow = (index) =>
    setOpenRows((current) => {
      const next = new Set(current);
      if (next.has(index)) next.delete(index); else next.add(index);
      return next;

    <div className="min-h-[220px] w-full max-w-80 pb-1">
      <button type="button" aria-expanded={open} onClick={() => setOpen((current) => !current)}

                  <Icon name="chevron" size={12}
                    className={`absolute transition-[opacity,transform] duration-150 group-hover/row:opacity-100 ${rowOpen ? "opacity-100" : "opacity-0"}`}
                    style={{ transform: rowOpen ? "rotate(0deg)" : "rotate(-90deg)" }} />
                </span>
                <span className="shrink-0 text-caption font-medium text-ink">{row.label}</span>
                <Chip mono={row.mono} className="min-w-0 flex-1 cursor-pointer truncate hover:bg-hover-2">
                  {row.chip}
                </Chip>
              </button>
              <Disclosure open={rowOpen}>
                  <div className="mt-0.5 mb-1 ml-2 flex flex-col gap-0.5 border-l border-line py-0.5 pl-3.5">
                    {row.detail.map((line, lineIndex) => (
                      <span key={lineIndex} className={`truncate text-tiny leading-[1.6] ${row.detailMono ? "font-mono" : ""} ${line.tone === "add" ? "text-green" : "text-ink-2"}`}>
                        {line.text}
                      </span>
                    ))}
                  </div>
              </Disclosure>
            </div>
            );
          })}
        </div>
      {step >= total && (
        <div className="mt-2.5 flex max-w-full flex-wrap gap-1.5 border-t border-line pt-2.5">
          {diffs.map((d, i) => (
            <span key={d.file} data-diffchip className="relative" onMouseEnter={openPreview(d.file)} onMouseLeave={closePreview(d.file)}>
              <Chip as="button" type="button" tone="surface" size="md" mono
                aria-expanded={preview?.file === d.file} aria-label={`Show diff for ${d.file}`}
                aria-describedby={preview?.file === d.file ? "ds-diff-preview" : undefined}
                onFocus={openPreview(d.file)} onBlur={closePreview(d.file)}
                className="max-w-full hover:bg-hover"
                style={popIn(i, { duration: 250 })}>
                <span className="min-w-0 truncate">{d.file}</span>
                <DiffStat add={d.add} del={d.del} />

              style={{ animation: `fade-in 300ms ease-out ${diffs.length * 80}ms both` }}>
              {more}
            </button>
          )}
        </div>
      )}
      </Disclosure>
      {preview && (
        <Popover id="ds-diff-preview" x={preview.x} top={preview.top} bottom={preview.bottom}
          onClose={() => setPreview(null)} onMouseEnter={cancelClose} onMouseLeave={closePreview(preview.file)}>
          <div className="flex items-center justify-between border-b border-line px-2.5 py-1.5 font-mono text-tiny">

const TR_TICKS = [600, 900, 2400, 1400, 2400, 600];
function SpinnerRing({ active, children }) {
  const size = 24, stroke = 2;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <span className="relative inline-flex shrink-0 items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="absolute inset-0" style={active ? { animation: "spin 1.1s linear infinite" } : undefined}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--line)" strokeWidth={stroke} />
        {active && (
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--ink-3)" strokeWidth={stroke} strokeLinecap="round"
            strokeDasharray={`${c * 0.28} ${c * 0.72}`} />
        )}
      </svg>
      <span className="relative text-micro font-semibold tabular-nums text-ink">{children}</span>
    </span>
  );
}
function StatusDot({ tone, children }) {

    <span className={`flex size-5.5 shrink-0 items-center justify-center rounded-full text-canvas ${tone === "red" ? "bg-red" : "bg-green"}`}
      style={{ animation: "pop-in 300ms var(--ease-out-quint) both" }}>
      {children}

  );
}
const pillEnter = { animation: "fade-in 200ms ease-out both" };
function TaskRows({ variant = "Capsules", rows: rowsProp }) {
  const tick = useSequence(TR_TICKS);

  const draftStatus = tick < 3 ? "pending" : tick === 3 ? "failed" : "completed";
  const rows = rowsProp ?? [

      details: [{ label: "Matched tax and contact IDs", meta: "12/12" }, { label: "Flagged stale records", meta: "0" }] },

      details: [{ label: "Cone supplier follow-up", meta: "draft" }, { label: "Pistachio reorder note", meta: "draft" }] },
  ];
  const badgeFor = (row) =>
    row.status === "completed" ? (
      <StatusDot tone="green"><Icon name="check" size={13} strokeWidth={3.5} /></StatusDot>

      <SpinnerRing active={row.status === "active"}>{row.step}</SpinnerRing>

    row.status === "completed" ? (
      <Badge tone="green" style={pillEnter}>Completed</Badge>
    ) : row.status === "failed" ? (

        return (
          <div key={row.key}
            className={`self-stretch overflow-hidden transition-[border-radius,background-color] duration-300 hover:bg-inset ${list ? "border-b border-line last:border-0" : "bg-surface shadow-card"}`}

            <Disclosure open={open} live={demo}>

const CC_TABS = ["Flavors", "Suppliers"];
const CC_ACTIONS = [

const CC_REPLIES = [

  { label: "Comparison", sub: "Trend Detection", time: "2s", body: "Mint chip is up 12% with stronger weekend peaks." },

function ReplySection({ label, sub, time, body, resolving }) {
  return (
    <div
      className="flex w-full flex-col gap-1.5 transition-[opacity,filter,transform] duration-400"
      style={{
        opacity: resolving ? 0.55 : 1,
        filter: resolving ? "blur(0.5px)" : "blur(0)",
        transform: resolving ? "scale(0.985)" : "scale(1)",
        transformOrigin: "top left",
        transitionTimingFunction: "var(--ease-out-quint)",
        ...fadeUp(0, { duration: 400 }),
      }}
    >
      <div className="flex items-center gap-1 text-small leading-[1.3]">
        <span className="font-medium text-ink">{label}</span>
        <span className="text-ink-2">{sub}</span>
        <span className="text-ink">for {time}</span>
      </div>
      <p className="text-body leading-normal text-ink">{body}</p>
    </div>
  );
}
function ChatComposer({ tabs = CC_TABS, placeholder = "Prompt or tag a flavor with @", initialMessage = "Compare mint chip to last summer", replies = CC_REPLIES, onSend }) {
  const [phase, setPhase] = useState(initialMessage ? "done" : "idle");
  const [draft, setDraft] = useState("");
  const [submitted, setSubmitted] = useState(initialMessage);
  const [tab, setTab] = useState(tabs[0]);
  const inputRef = useRef(null);
  useEffect(() => {
    let t;
    if (phase === "sent") t = setTimeout(() => setPhase("reply1"), 500);
    else if (phase === "reply1") t = setTimeout(() => setPhase("reply2"), 1400);
    else if (phase === "reply2") t = setTimeout(() => setPhase("done"), 1200);
    else return;
    return () => clearTimeout(t);
  }, [phase]);
  const sent = phase !== "idle";
  const canSend = draft.trim().length > 0;
  const send = () => {
    if (!canSend) return;
    const text = draft.trim();
    setSubmitted(text);
    onSend?.(text);
    setDraft("");
    setPhase("sent");
  };
  return (
    <Card className="flex h-[288px] w-full max-w-95 flex-col self-start">
      <div className="flex shrink-0 items-center justify-between border-b border-line p-1.5">
        <div className="flex items-center">
          {tabs.map((item) => (
            <button key={item} type="button" aria-pressed={tab === item} onClick={() => setTab(item)}
              className={`rounded-sm px-2 py-[3px] text-body text-ink transition-[background-color,opacity] duration-150 ${tab === item ? "bg-field" : "opacity-50 hover:opacity-75"}`}>
              {item}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-1">
          {CC_ACTIONS.map(({ name, label }) => (
            <IconButton key={name} label={label} className="text-ink-3 hover:bg-hover hover:text-ink-2">
              <Icon name={name} size={15} strokeWidth={2} />
            </IconButton>
          ))}
        </div>
      </div>
      <div className="flex min-h-0 flex-1 flex-col gap-2.5 overflow-y-auto px-3 pt-2.5 pb-1">
        <div className="flex justify-end pl-14">
          <div className="rounded-md bg-field px-3 py-1.5 text-body leading-[1.4] text-ink transition-[opacity,transform] duration-300"
            style={{ opacity: sent ? 1 : 0, transform: sent ? "translateY(0)" : "translateY(10px)", transitionTimingFunction: "var(--ease-out-quint)" }}>
            {submitted}
          </div>
        </div>
        <div aria-live="polite" className="contents">
          {(phase === "reply1" || phase === "reply2" || phase === "done") && replies[0] ? (
            <ReplySection {...replies[0]} />
          ) : null}
          {(phase === "reply2" || phase === "done") && replies[1] ? (
            <ReplySection {...replies[1]} resolving={phase === "reply2"} />
          ) : null}
        </div>
      </div>
      <div className="mt-auto shrink-0 p-1.5">
        <div role="presentation" onClick={() => inputRef.current?.focus()}
          className="primitive-field flex cursor-text flex-col gap-2 rounded-control border border-line bg-field p-2.5">
          <input ref={inputRef} value={draft} onChange={(event) => setDraft(event.target.value)}
            onKeyDown={(event) => { if (event.key === "Enter" && !event.nativeEvent.isComposing) send(); }}
            placeholder={placeholder} aria-label="Chat prompt"
            className="min-h-4.5 bg-transparent text-body leading-[1.4] text-ink outline-none placeholder:text-ink-3" />
          <div className="flex items-center justify-end">
            <SendButton enabled={canSend} onClick={send} />
          </div>
        </div>
      </div>
    </Card>
  );
}

      setSelected(i);
      setAccepted(false);
    }}
    className="flex w-full items-center gap-2.5 rounded-control px-1.5 py-1.5
                  text-left transition-colors duration-150 hover:bg-hover"
  >
                <RcMeter signal={o.signal} tone={o.tone} />
                <span className="min-w-0 flex-1 truncate text-caption text-ink">{o.short}</span>
                <span className="shrink-0 text-tiny text-ink-3">{o.label}</span>
              </button>)}
          </div>
      </Disclosure>
      <div className="primitive-card-footer flex items-center justify-between gap-3 bg-inset">
        <span className="flex items-center gap-2">
          <RcMeter signal={active.signal} tone={active.tone} />
          <span className="text-caption font-medium text-ink-2">{active.label}</span>
        </span>
        <span className="-mr-0.5 flex items-center gap-2">
          <Button
    variant="secondary"
    size="sm"
    aria-expanded={open}
    onClick={() => setOpen((current) => !current)}
  >
            Alternatives
          </Button>
          <Button
    variant={accepted ? "success" : active.ctaVariant}
    size="sm"
    onClick={() => {
      if (accepted) return;
      setAccepted(true);
      onAccept?.(active);
    }}
  >
            {accepted ? "Accepted" : active.cta}
          </Button>
        </span>
      </div>
    </Card>;
}

  Classic: "bg-accent",
  Retro: "bg-ink-3",

function DtIncludedMark({ included, tone }) {
  return <span
    aria-hidden
    className={`flex size-4.5 shrink-0 items-center justify-center rounded-[5px] transition-[background-color,color,transform] duration-150 ${included ? tone === "red" ? "bg-red text-canvas" : "bg-green text-canvas" : "bg-inset text-ink-3 shadow-hairline"}`}
    style={{ transform: included ? "scale(1)" : "scale(0.92)" }}
  >
      {included ? <Icon name="check" size={11} strokeWidth={3} /> : null}
    </span>;
}
function DiffTable({
  title = "Proposed menu cleanup",
  rows = DT_ROWS,
  added = DT_ADDED,
  onApply
} = {}) {
  const stage = useSequence(DT_STAGE_DELAYS);
  const tinted = stage >= 1;
  const settled = stage >= 2;
  const [accepted, setAccepted] = useState(false);
  const [edits, setEdits] = useState(
    () => Object.fromEntries([
      ...rows.filter((row) => row.removed).map((row) => [row.key, true]),
      ...added ? [[added.key, true]] : []
    ])
  );
  const removals = rows.filter((row) => row.removed && edits[row.key]).length;
  const additions = added && edits[added.key] ? 1 : 0;
  const total = removals + additions;
  const showAdded = settled && added !== null;
  const toggleEdit = (key) => setEdits((current) => ({ ...current, [key]: !current[key] }));
  return <div className="w-full max-w-95">
      <div className="relative overflow-hidden rounded-card bg-surface shadow-card">
        <div className="primitive-card-bar flex items-center justify-between border-b border-line">
          <span className="text-caption font-medium text-ink">{title}</span>
          {settled && !accepted && <span className="text-tiny text-ink-3">Click changed rows to toggle</span>}
        </div>
        <table className="w-full table-fixed border-collapse text-left">
          <colgroup>
            <col className="w-[34%]" />
            <col className="w-[30%]" />
            <col className="w-[36%]" />
          </colgroup>
          <thead>
            <tr className="border-b border-line">
              {["Flavor", "Category", "Supplier"].map((h) => <th key={h} className="primitive-table-cell text-small font-medium text-ink-3">
                  {h}
                </th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map((row) => {
    const out = row.removed && tinted && edits[row.key];
    const interactive = row.removed && settled && !accepted;
    return (
      /* rows swap the shared offset outline for an inset ring —
         an offset outline would clip against the card's rounded
         overflow-hidden edge (sanctioned deviation) */
      <tr
        key={row.key}
        tabIndex={interactive ? 0 : void 0}
        role={row.removed ? "checkbox" : void 0}
        aria-checked={row.removed ? edits[row.key] : void 0}
        aria-label={row.removed ? `Include removing ${row.id}` : void 0}
        aria-disabled={row.removed && accepted ? true : void 0}
        onClick={interactive ? () => toggleEdit(row.key) : void 0}
        onKeyDown={interactive ? (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleEdit(row.key);
          }
        } : void 0}
        className={`border-b border-line transition-[background-color,filter,opacity] duration-150 last:border-0 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-inset focus-visible:ring-accent ${interactive ? "cursor-pointer hover:brightness-[0.985]" : ""}`}
        style={{ background: out ? "var(--red-tint)" : void 0 }}
      >
                  <td
        className="primitive-table-cell text-body font-medium tabular-nums transition-colors duration-200"
        style={{ color: out ? "var(--red)" : "var(--ink)" }}
      >
                    {row.id}
                  </td>
                  <td className="primitive-table-cell">
                    <span
        className="inline-flex h-5.5 items-center gap-1.5 rounded-full bg-inset px-2 text-tiny font-medium shadow-hairline transition-opacity duration-200"
        style={{ opacity: out ? 0.55 : 1 }}
      >
                      <span className={`size-1.5 rounded-full ${DT_DOT[row.dept] ?? "bg-ink-3"}`} />
                      <span className="text-ink-2">{row.dept}</span>
                    </span>
                  </td>
                  <td
        className="primitive-table-cell text-caption whitespace-nowrap transition-colors duration-200"
        style={{
          color: out ? "var(--red)" : "var(--ink-2)",
          textDecorationLine: out ? "line-through" : "none",
          textDecorationColor: "color-mix(in srgb, var(--red) 50%, transparent)"
        }}
      >
                    <span className="flex items-center justify-between gap-2">
                      <span className="min-w-0 truncate">{row.email}</span>
                      {row.removed && settled && <DtIncludedMark included={edits[row.key]} tone="red" />}
                    </span>
                  </td>
                </tr>
    );
  })}
            {
    /* added row */
  }
            {added && <tr>
                <td colSpan={3} className="p-0">
                  <Disclosure open={showAdded} duration={200}>
                      <div
    role="checkbox"
    tabIndex={accepted ? -1 : 0}
    aria-checked={edits[added.key]}
    aria-disabled={accepted || void 0}
    aria-label={`Include adding ${added.id}`}
    onClick={accepted ? void 0 : () => toggleEdit(added.key)}
    onKeyDown={accepted ? void 0 : (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleEdit(added.key);
      }
    }}
    className={`grid grid-cols-[34%_30%_36%] items-center transition-[background-color,filter,opacity] duration-150 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-inset focus-visible:ring-accent ${accepted ? "" : "cursor-pointer hover:brightness-[0.985]"}`}
    style={{ background: edits[added.key] ? "var(--green-tint)" : void 0 }}
  >
                        <span className="primitive-table-cell text-body font-medium tabular-nums transition-colors duration-200" style={{ color: edits[added.key] ? "var(--green)" : "var(--ink-3)" }}>
                          {added.id}

                            <span className="text-ink-2">{added.dept}</span>

                        </span>
                        <span className="primitive-table-cell text-caption transition-colors duration-200" style={{ color: edits[added.key] ? "var(--green)" : "var(--ink-3)" }}>
                          <span className="flex items-center justify-between gap-2">
                            <span className="min-w-0 truncate">{added.email}</span>
                            <DtIncludedMark included={edits[added.key]} tone="green" />
                          </span>
                        </span>
                      </div>
                  </Disclosure>
                </td>
              </tr>}
          </tbody>
        </table>
        {
    /* footer — the summary follows the row-level selection */
  }
        {settled && <div
    className="primitive-card-footer flex min-h-11 items-center justify-between"
    style={{ animation: "fade-up 180ms var(--ease-out-quint) both" }}

              </Badge> : <>

                </span>
              </>}
          </div>}
      </div>
    </div>;

const FT_ROWS = [
  { task: "Restock mango sorbet", date: "Dec 03", status: "todo", owner: "Mango Moon Gelato" },
  { task: "Churn black sesame", date: "Sep 22", status: "progress", owner: "Kumo Creamery" },
  { task: "Print summer menu", date: "Jan 02", status: "todo", owner: "Coral Coast Sorbet" },
  { task: "Taste-test batch 42", date: "Nov 08", status: "progress", owner: "Maple Orbit" },
  { task: "Order waffle cones", date: "Apr 14", status: "done", owner: "Aurora Scoops" }
];
const FT_STATUS = {
  todo: { label: "To do", pill: "status-pill-todo", dot: "var(--status-todo)" },
  progress: { label: "In Progress", pill: "status-pill-progress", dot: "var(--status-progress)" },
  done: { label: "Completed", pill: "status-pill-done", dot: "var(--status-done)" }
};
const FT_KEYS = ["all", "todo", "progress", "done"];
function FilterTable({
  rows = FT_ROWS
} = {}) {
  const [filter, setFilter] = useState("all");
  const countFor = (key) => key === "all" ? rows.length : rows.filter((row) => row.status === key).length;
  return <div className="w-full max-w-105">
      {
    /* filter chips */
  }
      <div
    className="-mx-1 mb-1 flex items-center gap-1 overflow-x-auto px-1 py-1"
    style={{ scrollbarWidth: "none" }}
  >
        {FT_KEYS.map((key) => {
    const active = filter === key;
    const status = key === "all" ? null : FT_STATUS[key];
    return <button
      key={key}
      type="button"
      aria-pressed={active}
      onClick={() => setFilter(key)}
      className={`flex h-6.5 shrink-0 items-center gap-1.5 rounded-full px-2.5 text-small
                font-medium transition-[background-color,box-shadow,color] duration-200
                ${active ? "bg-surface text-ink shadow-btn" : "text-ink-2 hover:bg-hover"}`}
    >
              {status && <span className="size-1.5 rounded-full" style={{ background: status.dot }} />}
              {status ? status.label : "All"}
              <span
      className={`rounded-[4px] px-1 text-micro tabular-nums
                  ${active ? "bg-field text-ink-2" : "text-ink-3"}`}
    >
                {countFor(key)}
              </span>
            </button>;
  })}
      </div>
      {
    /* table */
  }
      <div

  const r = 42, C = 2 * Math.PI * r;
  return (
    <div className={`relative shrink-0 ${className}`} style={{ width: size, height: size, maxWidth: "100%" }} role="img"
      aria-label={`${label}: ${value.toLocaleString()} of ${max.toLocaleString()}, ${Math.round(pct * 100)}%`}>
      <svg viewBox="0 0 100 100" className="size-full -rotate-90">
        <circle cx="50" cy="50" r={r} fill="none" strokeWidth="11" className="stroke-chart-track" />
        <circle cx="50" cy="50" r={r} fill="none" strokeWidth="11" strokeLinecap="round" className={SERIES_STROKE[color]}
          strokeDasharray={`${pct * C} ${C}`} style={{ transition: "stroke-dasharray 520ms var(--ease-out-quint)" }} />
      </svg>
      <span className="absolute inset-0 flex flex-col items-center justify-center gap-0.5">
        <span className="text-title font-semibold text-ink tabular-nums">{compact(value)}</span>
        <span className="text-tiny text-ink-3">{label}</span>
      </span>
    </div>
  );
}
function Sparkline({ values = [4, 7, 5, 9, 8, 12, 10, 15], color = 1, area = true, className = "" }) {
  const gradientId = useId();
  const W = 100, H = 28;
  /* One point is not a trend — drawing it fills a wedge that isn't there. */
  if (values.length < 2) return null;
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const step = W / (values.length - 1);
  const d = values.map((v, i) => `${i ? "L" : "M"}${i * step} ${H - ((v - min) / span) * H}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true" className={`h-8 w-full ${SERIES_TEXT[color]} ${className}`}>
      {area && (
        <>
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="currentColor" stopOpacity="0.24" />
              <stop offset="100%" stopColor="currentColor" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${d} L${W} ${H} L0 ${H} Z`} fill={`url(#${gradientId})`} />
        </>
      )}
      <path d={d} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

/* ── runtime accent (components/theme.ts mirror) ── */
const TH_OVERRIDE_ID = "ds-accent-override";
const TH_LIGHT_ANCHOR = "#ffffff";
const TH_DARK_ANCHOR = "#262626";
const TH_MIN_CONTRAST = 4.5;
function TH_hexToRgb(hex) {
  const match = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!match) return null;
  const value = parseInt(match[1], 16);
  return { r: value >> 16 & 255, g: value >> 8 & 255, b: value & 255 };
}
const TH_toHex = ({ r, g, b }) => `#${[r, g, b].map((channel) => Math.round(channel).toString(16).padStart(2, "0")).join("")}`;
function TH_luminance({ r, g, b }) {
  const channel = (value) => {
    const scaled = value / 255;
    return scaled <= 0.03928 ? scaled / 12.92 : ((scaled + 0.055) / 1.055) ** 2.4;
  };
  return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
}
function TH_contrast(a, b) {
  const la = TH_luminance(a);
  const lb = TH_luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function TH_rgbToHsl({ r, g, b }) {
  const rn = r / 255;
  const gn = g / 255;
  const bn = b / 255;
  const max = Math.max(rn, gn, bn);
  const min = Math.min(rn, gn, bn);
  const l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l };
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === rn ? ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6 : max === gn ? ((bn - rn) / d + 2) / 6 : ((rn - gn) / d + 4) / 6;
  return { h, s, l };
}
function TH_hslToRgb({ h, s, l }) {
  if (s === 0) return { r: l * 255, g: l * 255, b: l * 255 };
  const hue = (p2, q2, t) => {
    let tn = t;
    if (tn < 0) tn += 1;
    if (tn > 1) tn -= 1;
    if (tn < 1 / 6) return p2 + (q2 - p2) * 6 * tn;
    if (tn < 1 / 2) return q2;
    if (tn < 2 / 3) return p2 + (q2 - p2) * (2 / 3 - tn) * 6;
    return p2;
  };
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
  const p = 2 * l - q;
  return {
    r: hue(p, q, h + 1 / 3) * 255,
    g: hue(p, q, h) * 255,
    b: hue(p, q, h - 1 / 3) * 255
  };
}
function TH_fitContrast(color, anchor, direction) {
  const hsl = TH_rgbToHsl(color);
  let rounded = color;
  for (let step = 0; step <= 100; step += 1) {
    const candidate = TH_hslToRgb({
      ...hsl,
      l: Math.min(1, Math.max(0, hsl.l + direction * step * 0.01))
    });
    rounded = {
      r: Math.round(candidate.r),
      g: Math.round(candidate.g),
      b: Math.round(candidate.b)
    };
    if (TH_contrast(rounded, anchor) >= TH_MIN_CONTRAST) return rounded;
  }
  return rounded;
}
function deriveAccentVariants(color) {
  const rgb = TH_hexToRgb(color);
  if (!rgb) return null;
  const lightAnchor = TH_hexToRgb(TH_LIGHT_ANCHOR);
  const darkAnchor = TH_hexToRgb(TH_DARK_ANCHOR);
  return {
    light: TH_toHex(TH_fitContrast(rgb, lightAnchor, -1)),
    dark: TH_toHex(TH_fitContrast(rgb, darkAnchor, 1))
  };
}
function setAccent(color) {
  if (typeof document === "undefined") return null;
  const existing = document.getElementById(TH_OVERRIDE_ID);
  if (!color) {
    existing?.remove();
    return null;
  }
  const variants = deriveAccentVariants(color);
  if (!variants) return null;
  const element = existing ?? document.createElement("style");
  element.id = TH_OVERRIDE_ID;
  element.textContent = `:root:root:root:root { --accent: ${variants.light}; }
:root:root:root:root[data-theme="dark"] { --accent: ${variants.dark}; }`;
  if (!existing) document.head.appendChild(element);
  return variants;
}
function useAccent() {
  const [accent, setAccentState] = useState(() => { try { return localStorage.getItem("ds-accent") || ""; } catch { return ""; } });
  useEffect(() => {
    setAccent(accent || null);
    try { accent ? localStorage.setItem("ds-accent", accent) : localStorage.removeItem("ds-accent"); } catch {}
  }, [accent]);
  return [accent, setAccentState];
}

/* Figma-style picker, no dependencies. The square and hue gradients are the
   control's data, so they are the one place literal colours are legitimate. */
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
function hexToHsv(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!m) return { h: 0, s: 0, v: 0 };
  const n = parseInt(m[1], 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = (g - b) / d % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return { h, s: max ? d / max : 0, v: max };
}
function hsvToHex({ h, s, v }) {
  const c = v * s, x = c * (1 - Math.abs(h / 60 % 2 - 1)), m = v - c;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  const to = (n) => Math.round((n + m) * 255).toString(16).padStart(2, "0");
  return `#${to(r)}${to(g)}${to(b)}`;
}
const isHex = (s) => /^#[0-9a-f]{6}$/i.test(s);
/* The accent family: Lime green's saturation and lightness at spread hues.
   Same set as the landing page's "Pick an accent" row. */
const DEFAULT_SWATCHES = ["#a5e12a", "#e0a329", "#29e0c2", "#2985e0", "#9429e0", "#e02985", "#1a1a1a", "#ffffff"];
function ColorPicker({
  value = "#a5e12a",
  onChange,
  swatches = DEFAULT_SWATCHES,
  className = ""
}) {
  const id = useId();
  const [hsv, setHsv] = useState(() => hexToHsv(value));
  const [text, setText] = useState(value.toUpperCase());
  const squareRef = useRef(null);

  useEffect(() => {

  const commit = (next) => {
    setHsv(next);

    setText(hex.toUpperCase());
    lastEmitted.current = hex;
    onChange?.(hex);
  };
  const fromPointer = (event) => {
    const box = squareRef.current?.getBoundingClientRect();
    if (!box) return;
    const s = clamp((event.clientX - box.left) / box.width, 0, 1);
    const v = clamp(1 - (event.clientY - box.top) / box.height, 0, 1);
    commit({ ...hsv, s, v });
  };
  const onSquareDown = (event) => {
    event.currentTarget.setPointerCapture(event.pointerId);
    squareRef.current?.focus();
    fromPointer(event);
  };
  const onSquareMove = (event) => {
    if (event.buttons & 1) fromPointer(event);
  };
  const onSquareKey = (event) => {
    const step = event.shiftKey ? 0.1 : 0.02;
    const map = {
      ArrowLeft: { s: clamp(hsv.s - step, 0, 1) },
      ArrowRight: { s: clamp(hsv.s + step, 0, 1) },
      ArrowUp: { v: clamp(hsv.v + step, 0, 1) },
      ArrowDown: { v: clamp(hsv.v - step, 0, 1) }
    };
    const delta = map[event.key];
    if (!delta) return;
    event.preventDefault();
    commit({ ...hsv, ...delta });
  };
  const onTextChange = (raw) => {
    const next = raw.startsWith("#") ? raw : `#${raw}`;
    setText(next.toUpperCase());
    if (isHex(next)) {
      const parsed = hexToHsv(next);
      setHsv(parsed);
      lastEmitted.current = next.toLowerCase();
      onChange?.(next.toLowerCase());
    }
  };
  const eyedropper = typeof window !== "undefined" && "EyeDropper" in window;
  const pick = async () => {
    try {
      const result = await new window.EyeDropper().open();
      onTextChange(result.sRGBHex);
    } catch {
    }
  };
  const hueHex = hsvToHex({ h: hsv.h, s: 1, v: 1 });
  const current = hsvToHex(hsv);
  return <div className={`flex w-full max-w-70 flex-col gap-3 ${className}`}>
      {
    /* saturation / brightness */
  }
      <div
    ref={squareRef}
    role="slider"
    tabIndex={0}
    aria-label="Saturation and brightness"
    aria-valuetext={`saturation ${Math.round(hsv.s * 100)} percent, brightness ${Math.round(hsv.v * 100)} percent`}
    aria-valuenow={Math.round(hsv.v * 100)}
    aria-valuemin={0}
    aria-valuemax={100}
    onPointerDown={onSquareDown}
    onPointerMove={onSquareMove}
    onKeyDown={onSquareKey}
    className="corner-smooth relative aspect-[4/3] w-full cursor-crosshair touch-none overflow-hidden rounded-control"
    style={{
      background: `linear-gradient(to top, #000000, transparent), linear-gradient(to right, #ffffff, ${hueHex})`
    }}
  >
        <span
    aria-hidden
    className="absolute size-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-surface"
    style={{ left: `${hsv.s * 100}%`, top: `${(1 - hsv.v) * 100}%`, background: current, boxShadow: "var(--shadow-overlay)" }}
  />
      </div>

      {
    /* hue */
  }
      <input
    type="range"
    min={0}
    max={360}
    step={1}
    value={Math.round(hsv.h)}
    aria-label="Hue"
    onChange={(e) => commit({ ...hsv, h: Number(e.target.value) })}
    className="color-picker-hue w-full"
    style={{ background: "linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)" }}
  />

      {
    /* hex + eyedropper */
  }
      <div className="flex items-center gap-2">
        <span className="corner-smooth flex h-8 min-w-0 flex-1 items-center gap-1.5 rounded-control bg-field px-2.5 transition-colors duration-150 focus-within:bg-hover-2">
          <span aria-hidden className="size-3.5 shrink-0 rounded-full" style={{ background: current, boxShadow: "var(--shadow-overlay)" }} />
          <span className="font-mono text-caption text-ink-3">#</span>
          <input
    id={`${id}-hex`}
    aria-label="Hex colour"
    value={text.replace(/^#/, "")}
    onChange={(e) => onTextChange(e.target.value)}
    onBlur={() => {
      if (!isHex(text)) setText(current.toUpperCase());
    }}
    spellCheck={false}
    maxLength={6}
    className="min-w-0 flex-1 bg-transparent font-mono text-caption text-ink uppercase outline-none"
  />
        </span>
        {eyedropper && <IconButton label="Pick a colour from the screen" onClick={pick} className="size-8 rounded-control bg-field text-ink-2 hover:bg-hover-2 hover:text-ink">
            <Icon name="edit" size={14} strokeWidth={2} />
          </IconButton>}
      </div>

      {
    /* swatches */
  }
      {swatches.length > 0 && <div className="flex flex-wrap gap-1.5" role="group" aria-label="Swatches">
          {swatches.map((hex) => {
    const on = hex.toLowerCase() === current.toLowerCase();
    return <button
      key={hex}
      type="button"
      aria-label={hex}
      aria-pressed={on}
      onClick={() => onTextChange(hex)}
      className="corner-smooth size-6 rounded-control transition-transform duration-150 hover:scale-110"
      style={{ background: hex, boxShadow: on ? "0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink)" : "var(--shadow-overlay)" }}
    />;
  })}
        </div>}
    </div>;
}

const PAGE_INDEX = Object.fromEntries(PAGES.map((p, i) => [p.id, i]));

/* ═══════════ Global knobs: radius + size (mirror the data-* token scales) ═══════════ */
function useRootAttr(key, storageKey, fallback) {
  const [value, setValue] = useState(() => { try { return localStorage.getItem(storageKey) || fallback; } catch { return fallback; } });
  useEffect(() => {
    if (value === fallback) delete document.documentElement.dataset[key];
    else document.documentElement.dataset[key] = value;
    try { value === fallback ? localStorage.removeItem(storageKey) : localStorage.setItem(storageKey, value); } catch {}
  }, [value]);
  return [value, setValue];
}
function useRadius() { return useRootAttr("radius", "ds-radius", "default"); }
function useSize() { return useRootAttr("size", "ds-size", "default"); }

/* ═══════════ Routing: #/button — legacy #button anchors still resolve ═══════════ */
function readRoute() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  return PAGE_INDEX[raw] !== undefined ? raw : PAGES[0].id;
}
function useRoute() {
  const [route, setRoute] = useState(readRoute);
  useEffect(() => {
    const onHash = () => {
      const next = readRoute();
      // normalise old-style #button to #/button so the address bar is canonical
      if (location.hash && !location.hash.startsWith("#/") && PAGE_INDEX[location.hash.slice(1)] !== undefined) {
        history.replaceState(null, "", `#/${location.hash.slice(1)}`);
      }
      setRoute(next);
      window.scrollTo({ top: 0 });
      const title = PAGES[PAGE_INDEX[next]]?.title;
      if (title) document.title = `${title} · Formic AI Design System`;
      /* Focus follows the navigation, so keyboard and screen-reader users
         land on the new page's heading instead of staying on the rail link. */
      requestAnimationFrame(() => document.getElementById("page-title")?.focus({ preventScroll: true }));
    };
    window.addEventListener("hashchange", onHash);
    onHash();
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}

/* ═══════════ Playground engine ═══════════ */
/* A schema is a list of controls; the engine keeps one state object and
   hands it to `render` as props. Kept deliberately small: select, text,
   number, toggle. Anything a knob can't express stays in the demos. */
function usePlayground(schema, resetKey) {
  const initial = Object.fromEntries(schema.map((c) => [c.key, c.value]));
  const [store, setStore] = useState({ key: resetKey, values: initial });
  /* Derive-from-props reset: when the page changes, swap state DURING this
     render rather than in an effect. An effect reset leaves one committed
     frame where the previous page's values reach the new component — a
     chip's tone:"field" landing on Alert throws, and with no error
     boundary that is a white screen. React re-renders before commit here. */
  let values = store.values;
  if (store.key !== resetKey) {
    values = initial;
    setStore({ key: resetKey, values: initial });
  }
  const set = (key, value) => setStore((st) => ({ key: st.key, values: { ...st.values, [key]: value } }));
  const reset = () => setStore({ key: resetKey, values: initial });
  return [values, set, reset];
}

        );
      })}
    </div>
  );
}

/* ═══════════ Playground schemas — the first set ═══════════ */
const PLAYGROUNDS = {
  button: {
    schema: [
      { key: "variant", label: "Variant", type: "select", value: "accent", options: ["primary", "secondary", "outline", "ghost", "link", "destructive", "destructive-soft", "accent", "accent-soft", "success"] },
      { key: "size", label: "Size", type: "select", value: "md", options: ["xs", "sm", "md", "lg"] },

  chip: {

  },
  switch: {
    schema: [
      { key: "on", label: "On", type: "toggle", value: true },
      { key: "size", label: "Size", type: "select", value: "md", options: ["sm", "md"] },
      { key: "label", label: "Label", type: "text", value: "Notifications" },
      { key: "disabled", label: "Disabled", type: "toggle", value: false },

  alert: {
    schema: [
      { key: "tone", label: "Tone", type: "select", value: "info", options: ["neutral", "info", "success", "warning", "error"] },
      { key: "title", label: "Title", type: "text", value: "Batch scheduled" },
      { key: "body", label: "Body", type: "text", value: "Pistachio churns first at 6:00pm." },
      { key: "dismiss", label: "Dismissible", type: "toggle", value: true },
    ],
    render: (p) => <Alert tone={p.tone} title={p.title} onDismiss={p.dismiss ? () => {} : undefined}>{p.body}</Alert>,
  },
  input: {
    schema: [
      { key: "label", label: "Label", type: "text", value: "Flavor name" },
      { key: "placeholder", label: "Placeholder", type: "text", value: "e.g. Pistachio" },
      { key: "size", label: "Size", type: "select", value: "md", options: ["sm", "md"] },
      { key: "hint", label: "Hint", type: "text", value: "Shown on the menu board." },
      { heading: "State" },
      { key: "invalid", label: "Invalid", type: "toggle", value: false },
      { key: "disabled", label: "Disabled", type: "toggle", value: false },
      { key: "required", label: "Required", type: "toggle", value: false },
    ],
    render: (p) => (
      <div className="w-full max-w-80">
        <Field label={p.label} hint={p.invalid ? undefined : p.hint} error={p.invalid ? "That name is already on the board." : undefined} required={p.required}>

  select: {
    schema: [
      { key: "size", label: "Size", type: "select", value: "md", options: ["sm", "md"] },
      { key: "placeholder", label: "Placeholder", type: "text", value: "Pick a base…" },
      { key: "invalid", label: "Invalid", type: "toggle", value: false },
      { key: "disabled", label: "Disabled", type: "toggle", value: false },
    ],
    render: (p) => <div className="w-full max-w-80"><Select size={p.size} placeholder={p.placeholder} invalid={p.invalid} disabled={p.disabled} /></div>,
  },
  progress: {
    schema: [
      { key: "value", label: "Value", type: "number", value: 62, min: 0, max: 100 },
      { key: "tone", label: "Tone", type: "select", value: "accent", options: ["accent", "green"] },
      { key: "label", label: "Label", type: "text", value: "Churning" },
      { key: "indeterminate", label: "Indeterminate", type: "toggle", value: false },
    ],
    render: (p) => <div className="w-full max-w-80"><Progress value={p.value} tone={p.tone} label={p.label} indeterminate={p.indeterminate} /></div>,
  },
  loadingstate: {
    schema: [
      { key: "variant", label: "Variant", type: "select", value: "Drive", options: ["Drive", "Dots", "Orbit"] },
      { key: "label", label: "Label", type: "text", value: "Indexing sources" },
    ],
    render: (p) => <LoadingState variant={p.variant} label={p.label} />,
  },
  avatar: {
    schema: [
      { key: "name", label: "Name", type: "text", value: "Amina Tesfaye" },
      { key: "size", label: "Size", type: "select", value: "lg", options: ["sm", "md", "lg", "xl"] },
      { key: "tone", label: "Tone", type: "select", value: 0, options: [0, 1, 2, 3] },
    ],
    render: (p) => <Avatar name={p.name} size={p.size} tone={p.tone} />,
  },
  statcard: {
    schema: [
      { key: "label", label: "Label", type: "text", value: "Total income" },
      { key: "display", label: "Value", type: "text", value: "$4,673" },
      { key: "caption", label: "Caption", type: "text", value: "Last week" },
      { key: "delta", label: "Delta", type: "text", value: "+25.2%" },
      { key: "deltaTone", label: "Direction", type: "select", value: "up", options: ["up", "down", "flat"] },
      { key: "icon", label: "Icon", type: "toggle", value: true },
      { key: "iconTone", label: "Icon tone", type: "select", value: 2, options: [1, 2, 3, 4, 5] },
      { key: "trend", label: "Sparkline", type: "toggle", value: true },
    ],
    render: (p) => (
      <StatCard label={p.label} display={p.display} caption={p.caption} delta={p.delta} deltaTone={p.deltaTone}
        icon={p.icon ? "chart" : undefined} iconTone={p.iconTone} trend={p.trend ? [3, 6, 4, 9, 7, 11, 10, 14] : undefined} trendTone={p.iconTone} />
    ),
  },
  charts: {
    schema: [
      { key: "chart", label: "Chart", type: "select", value: "Bar", options: ["Bar", "Line", "Donut"] },
      { heading: "Bar" },
      { key: "variant", label: "Variant", type: "select", value: "grouped", options: ["grouped", "stacked"] },
      { key: "series", label: "Series", type: "select", value: 1, options: [1, 2, 3] },
      { key: "highlight", label: "Highlight Feb", type: "toggle", value: true },
      { key: "showValues", label: "Values", type: "toggle", value: true },
      { heading: "Line" },
      { key: "area", label: "Area fill", type: "toggle", value: true },
      { key: "points", label: "Points", type: "toggle", value: true },
      { heading: "Donut" },
      { key: "value", label: "Value", type: "number", value: 500, min: 0, max: 720 },
      { key: "color", label: "Colour", type: "select", value: 4, options: [1, 2, 3, 4, 5] },
    ],
    render: (p) => {
      const S = [
        { name: "Direct", values: [38, 52, 32, 12, 35, 28, 33, 25] },
        { name: "Referral", color: 3, values: [11, 9, 15, 12, 18, 14, 9, 16] },
        { name: "Organic", color: 5, values: [7, 13, 9, 16, 11, 19, 14, 10] },
      ].slice(0, p.series);
      if (p.chart === "Line") return <LineChart series={S} area={p.area} points={p.points} />;
      if (p.chart === "Donut") return <DonutChart value={p.value} max={720} color={p.color} />;
      return <BarChart series={S} variant={p.variant} highlight={p.highlight ? 1 : undefined} showValues={p.showValues} />;
    },
  },
  colorpicker: {
    schema: [
      { key: "value", label: "Value", type: "text", value: "#A5E12A" },
      { key: "swatches", label: "Swatches", type: "toggle", value: true },
    ],
    render: (p, set) => <ColorPicker value={/^#[0-9a-f]{6}$/i.test(p.value) ? p.value : "#a5e12a"} onChange={(hex) => set("value", hex.toUpperCase())} swatches={p.swatches ? undefined : []} />,
  },
  approvalflow: {
    schema: [
      { key: "questions", label: "Questions", type: "select", value: 3, options: [1, 2, 3] },
      { key: "send", label: "Send label", type: "text", value: "Send" },
      { key: "skip", label: "Skip label", type: "text", value: "Skip" },
      { key: "resettable", label: "Start over", type: "toggle", value: true },
    ],
    render: (p) => <ApprovalFlow key={p.questions} questions={QUESTIONS.slice(0, p.questions)} labels={{ send: p.send, skip: p.skip }} resettable={p.resettable} />,
  },
};

/* ═══════════ The docs shell ═══════════ */
const RADII = ["default", "sharp", "rounded", "full"];
const SIZES = ["default", "comfortable", "spacious"];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* The rail's accent swatch opens the real ColorPicker in an anchored layer. */
function AccentControl({ accent, setAccent }) {
  const layerId = useId();
  const { open, position, anchorRef, openAt, close } = useAnchoredLayer(layerId);
  const current = accent || (typeof window !== "undefined" ? getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()   : "#a5e12a");
  return (
    <div className="flex items-center gap-1.5">
      {accent && (
        <IconButton label="Reset custom accent" onClick={() => setAccent("")} className="text-ink-3 hover:bg-hover hover:text-ink">
          <Icon name="close" size={12} strokeWidth={2.2} />
        </IconButton>
      )}
      <button
        ref={anchorRef}
        type="button"
        aria-haspopup="dialog"
        aria-expanded={open}
        onClick={() => (open ? close() : openAt({ estimatedHeight: 320, width: 296, align: "end" }))}
        className="corner-smooth flex h-7 items-center gap-2 rounded-control px-2 text-caption font-medium text-ink transition-colors duration-150 hover:bg-hover"
      >
        <span aria-hidden className="size-3.5 rounded-full" style={{ background: current, boxShadow: "var(--shadow-overlay)" }} />
        {accent ? accent.toUpperCase() : "Palette"}
      </button>
      {open && position && (
        <Popover id={layerId} role="dialog" x={position.x} top={position.top} bottom={position.bottom} width={296} onClose={close} className="p-3">
          <ColorPicker value={/^#[0-9a-f]{6}$/i.test(current) ? current : "#a5e12a"} onChange={setAccent} />
        </Popover>
      )}
    </div>
  );
}

function MakeThemYours({ theme, setTheme, palette, setPalette, accent, setAccent, radius, setRadius, size, setSize }) {
  return (
    <div className="flex flex-col gap-1">
      <ControlRow label="Theme">
        <RailSelect ariaLabel="Theme" value={cap(theme)} options={["Light", "Dark"]} onChange={(v) => setTheme(v.toLowerCase())} />
      </ControlRow>
      <ControlRow label="Palette">
        <RailSelect ariaLabel="Palette" value={cap(palette)} options={PALETTES.map((p) => p.label)} onChange={(v) => setPalette(PALETTES.find((p) => p.label === v).id)} />
      </ControlRow>
      <ControlRow label="Accent">
        <AccentControl accent={accent} setAccent={setAccent} />
      </ControlRow>
      <ControlRow label="Radius">
        <RailSelect ariaLabel="Radius" value={cap(radius)} options={RADII.map(cap)} onChange={(v) => setRadius(v.toLowerCase())} />
      </ControlRow>
      <ControlRow label="Size">
        <RailSelect ariaLabel="Size" value={cap(size)} options={SIZES.map(cap)} onChange={(v) => setSize(v.toLowerCase())} />
      </ControlRow>
    </div>
  );
}

function RailPanel({ title, action, children }) {
  return (
    <section className="rounded-card bg-surface p-4 shadow-card">
      <div className="mb-3 flex items-center justify-between gap-2">
        <h2 className="text-body font-semibold text-ink">{title}</h2>
        {action}
      </div>
      {children}
    </section>
  );
}

function Section({ id, title, note, children }) {
  return (
    <section id={id} className="mb-2 w-full">
      <h2 className="text-title font-semibold text-ink">{title}</h2>
      {note && <p className="mt-0.5 max-w-xl text-caption text-ink-3">{note}</p>}
      <div className="mt-4 flex flex-wrap gap-6">{children}</div>
    </section>
  );
}
/* Not Card: Card is overflow-hidden, and demo surfaces need floating UI
   (toolbars, popovers, tooltips) to escape the box rather than be clipped. */
function GalleryCard({ label, wide, full, children }) {
  return (
    <div className={`rounded-card bg-surface p-5 shadow-card ${full ? "w-full" : wide ? "w-full max-w-105" : ""}`}>
      <p className="mb-3 font-mono text-micro tracking-wide text-ink-3 uppercase">{label}</p>
      {children}
    </div>
  );
}

function DocsPage({ page, index, pg, state, set }) {
  const prev = PAGES[index - 1], next = PAGES[index + 1];
  const RAW = "https://raw.githubusercontent.com/eyosiyasketema1/formic-design-system/main";
  const files = page.file.split(" ");
  const install = files.map((f) => `curl --create-dirs -o src/${f} ${RAW}/${f}`).join(" && ");
  const [copied, setCopied] = useState(false);
  const copy = () => { try { navigator.clipboard.writeText(install); setCopied(true); setTimeout(() => setCopied(false), 1400); } catch {} };
  const PageBody = page.Component;
  return (
    <div className="flex min-w-0 gap-8">
      <div className="min-w-0 flex-1">
        <header className="mb-8 flex items-start justify-between gap-4">
          <div className="min-w-0">
            <h1 id="page-title" tabIndex={-1} className="text-display font-semibold tracking-tight text-ink outline-none">{page.title}</h1>
            {page.note && <p className="mt-1.5 max-w-2xl text-body text-ink-2">{page.note}</p>}
          </div>
          <div className="flex shrink-0 items-center gap-1">
            <IconButton label={prev ? `Previous: ${prev.title}` : "Previous"} onClick={() => prev && (location.hash = `#/${prev.id}`)} disabled={!prev} className="text-ink-3 hover:bg-hover hover:text-ink disabled:opacity-35">
              <Icon name="chevron-left" size={16} strokeWidth={2} />
            </IconButton>
            <IconButton label={next ? `Next: ${next.title}` : "Next"} onClick={() => next && (location.hash = `#/${next.id}`)} disabled={!next} className="text-ink-3 hover:bg-hover hover:text-ink disabled:opacity-35">
              <Icon name="chevron-right" size={16} strokeWidth={2} />
            </IconButton>
          </div>
        </header>

        <section className="mb-8">
          <h2 className="text-title font-semibold text-ink">Installation</h2>
          <div className="mt-3 flex items-center gap-2 rounded-control bg-field px-3 py-2">
            <code className="min-w-0 flex-1 truncate font-mono text-small text-ink">{install}</code>
            <IconButton label={copied ? "Copied" : "Copy install command"} onClick={copy} className="text-ink-3 hover:bg-hover hover:text-ink">
              <Icon name={copied ? "check" : "copy"} size={14} strokeWidth={2} />
            </IconButton>
          </div>
          <p className="mt-2 text-caption text-ink-3">Formic is vendored: copy the file in and own it. Tokens come from <code className="font-mono">styles/tokens.css</code>.</p>
        </section>

        {pg && (
          <section className="mb-8">
            <h2 className="text-title font-semibold text-ink">Playground</h2>
            <div className="mt-3 flex min-h-56 items-center justify-center rounded-card bg-surface p-8 shadow-card">
              {pg.render(state, set)}
            </div>
          </section>
        )}

        {/* the flex-wrap row the old <Section> used to provide: cards size to
            their content and sit with a gap, instead of stacking full-width */}
        <div className="flex flex-wrap gap-6">
          <PageBody />
        </div>
      </div>
    </div>
  );
}

function RailPanels({ page, pg, knobs, pgState, pgSet, pgReset }) {
  return (
    <>
      <RailPanel title="Make them yours"><MakeThemYours {...knobs} /></RailPanel>
      {pg && (
        <RailPanel title="Playground" action={
          <button type="button" onClick={pgReset} className="text-small font-medium text-ink-3 transition-colors duration-150 hover:text-ink">Reset</button>
        }>
          <p className="mb-2 text-caption font-semibold text-ink">{page.title}</p>
          <PlaygroundControls schema={pg.schema} state={pgState} set={pgSet} />
        </RailPanel>
      )}
    </>
  );
}

function App() {
  const [theme, setTheme] = useTheme();
  const [palette, setPalette] = usePalette();
  const [accent, setAccentState] = useAccent();
  const [radius, setRadius] = useRadius();
  const [size, setSize] = useSize();
  const route = useRoute();
  const index = PAGE_INDEX[route] ?? 0;
  const page = PAGES[index];
  const pg = PLAYGROUNDS[page.id];
  const [pgState, pgSet, pgReset] = usePlayground(pg ? pg.schema : [], page.id);
  const groups = [];
  for (const p of PAGES) {
    let g = groups.find((x) => x.label === p.group);
    if (!g) groups.push((g = { label: p.group, items: [] }));
    g.items.push(p);
  }
  const knobs = { theme, setTheme, palette, setPalette, accent, setAccent: setAccentState, radius, setRadius, size, setSize };
  return (
    <div className="flex min-h-screen">
      {/* left rail */}
      <aside className="sticky top-0 hidden h-screen w-60 shrink-0 flex-col overflow-y-auto border-r border-line bg-sidebar px-3 py-6 lg:flex">
        <div className="mb-5 px-2">
          <BackToSite className="-ml-2 mb-2" />
          <p className="text-title font-semibold tracking-tight text-ink">Formic AI Design System</p>
          <p className="mt-0.5 font-mono text-micro text-ink-3">v0.1 · {PAGES.filter((p) => p.group !== "Foundations").length} components</p>
        </div>
        <nav className="flex flex-col" aria-label="Components">
          {groups.map((g) => (
            <div key={g.label} className="mb-4">
              <p className="mb-1 flex items-baseline gap-1.5 px-2 font-mono text-micro tracking-wide text-ink-3 uppercase">
                {g.label} <span>{g.items.length}</span>
              </p>
              <div className="flex flex-col gap-px">
                {g.items.map((p) => (
                  <a key={p.id} href={`#/${p.id}`} aria-current={route === p.id ? "page" : undefined}
                    className={`corner-smooth rounded-control px-2 py-1 text-caption transition-colors duration-150 hover:bg-hover ${route === p.id ? "bg-hover-2 font-medium text-ink" : "text-ink-2"}`}>
                    {p.title}
                  </a>
                ))}
              </div>
            </div>
          ))}
        </nav>
      </aside>

      {/* centre */}
      <main className="min-w-0 flex-1 px-6 py-8 lg:px-10">
        <div className="mx-auto max-w-5xl">
          <div className="mb-6 lg:hidden">
            <BackToSite className="-ml-2 mb-2" />
            <div className="rounded-control bg-surface shadow-btn">
              <RailSelect ariaLabel="Go to component" value={page.title} options={PAGES.map((p) => p.title)} onChange={(t) => { const p = PAGES.find((x) => x.title === t); if (p) location.hash = `#/${p.id}`; }} />
            </div>
          </div>
          <div className="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:hidden">
            <RailPanels page={page} pg={pg} knobs={knobs} pgState={pgState} pgSet={pgSet} pgReset={pgReset} />
          </div>
          <DocsPage key={page.id} page={page} index={index} pg={pg} state={pgState} set={pgSet} />
        </div>
      </main>

      {/* right rail — below xl the same panels render inside the page instead */}
      <aside className="sticky top-0 hidden h-screen w-64 shrink-0 flex-col gap-4 overflow-y-auto px-4 py-6 xl:flex">
        <RailPanels page={page} pg={pg} knobs={knobs} pgState={pgState} pgSet={pgSet} pgReset={pgReset} />
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
</html>
